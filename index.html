
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexPOS PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#edf2ff;font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:#3978f6;color:white;font-weight:bold}
button.danger{background:#d94755}
button.secondary{background:#293750}
input,select{width:100%;padding:12px;margin:7px 0 13px;background:#111c30;border:1px solid #33445e;border-radius:9px;color:white}
label{color:#aebbd1;font-size:13px}
h1,h2,h3{margin-top:0}
header{padding:17px 20px;background:#111c30;border-bottom:1px solid #263650;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:bold;color:#72a5ff}
.logo span{color:white}
.container{max-width:1200px;margin:auto;padding:20px}
.panel{background:#142139;border:1px solid #293c59;border-radius:14px;padding:18px;margin-bottom:17px}
.login{max-width:400px;margin:12vh auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px}
.stat{background:#1b2b47;padding:18px;border-radius:12px}
.stat strong{display:block;font-size:27px;color:#82adff;margin-top:8px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.nav button{background:#263854}
.nav button.active{background:#3978f6}
table{width:100%;border-collapse:collapse;min-width:550px}
th,td{text-align:right;padding:12px;border-bottom:1px solid #2c3c55}
.tablewrap{overflow-x:auto}
.muted{color:#a7b5ca;font-size:13px}
.hidden{display:none!important}
.badge{padding:5px 9px;border-radius:20px;background:#1d664d;color:#9bffce;font-size:12px}
.badge.off{background:#67313c;color:#ffc0c8}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.product{background:#1c2d49;padding:14px;border-radius:10px}
.product button{margin-top:9px}
.notice{padding:12px;background:#392f18;color:#ffdf91;border-radius:9px;margin-bottom:15px;font-size:13px}
footer{text-align:center;padding:25px;color:#8292aa}
</style>
</head>
<body>
<header>
 <div class="logo">NexPOS <span>PRO</span></div>
 <div id="userInfo" class="muted">نظام إدارة المبيعات</div>
</header>

<div id="loginPage" class="container">
 <div class="panel login">
  <h2>تسجيل الدخول</h2>
  <p class="muted">مرحباً بك في NexPOS PRO</p>
  <label>اسم المستخدم</label>
  <input id="loginUser" placeholder="اسم المستخدم">
  <label>كلمة المرور</label>
  <input id="loginPass" type="password" placeholder="كلمة المرور">
  <button style="width:100%" onclick="login()">دخول النظام</button>
  <p id="loginError" style="color:#ff8793"></p>
  <p class="muted">نسخة تجريبية: حساب المالك الافتراضي مخصص للاختبار فقط.</p>
 </div>
</div>

<div id="app" class="container hidden">
 <div class="nav" id="navigation"></div>
 <div id="content"></div>
</div>

<footer>NexPOS PRO © 2026 | تطوير محمد الصلاحي</footer>

<script>
const OWNER_USER="elsalahy";
const OWNER_PASS="Ma01060600";

let db=JSON.parse(localStorage.getItem("nexpos_db")||'{"clients":[],"products":[],"sales":[]}');
let current=null;
let cart=[];
let page="home";

function save(){
 localStorage.setItem("nexpos_db",JSON.stringify(db));
}
function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function money(n){return Number(n||0).toLocaleString("ar-EG")+" ج.م";}
function login(){
 const u=document.getElementById("loginUser").value.trim();
 const p=document.getElementById("loginPass").value;
 if(u===OWNER_USER&&p===OWNER_PASS){
  current={role:"owner",name:"محمد الصلاحي"};
 }else{
  const client=db.clients.find(x=>x.username===u&&x.password===p&&x.enabled);
  if(!client){document.getElementById("loginError").textContent="بيانات الدخول غير صحيحة";return;}
  if(client.plan!=="lifetime"&&new Date(client.endDate)<new Date()){
   document.getElementById("loginError").textContent="انتهى الاشتراك، يرجى التواصل مع الإدارة";return;
  }
  current={role:"cashier",shopId:client.id,name:client.shop};
 }
 document.getElementById("loginPage").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("userInfo").textContent=current.name;
 render();
}
function logout(){
 current=null;cart=[];
 document.getElementById("app").classList.add("hidden");
 document.getElementById("loginPage").classList.remove("hidden");
 document.getElementById("loginPass").value="";
}
function nav(){
 let items=current.role==="owner"?
 [["home","الرئيسية"],["clients","العملاء والاشتراكات"],["newclient","إضافة عميل"],["reports","التقارير"]]:
 [["home","الكاشير"],["products","المنتجات"],["sales","المبيعات"]];
 document.getElementById("navigation").innerHTML=
 items.map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join("")+
 `<button class="secondary" onclick="logout()">تسجيل خروج</button>`;
}
function go(p){page=p;render();}
function render(){
 nav();
 if(current.role==="owner") ownerPage();
 else cashierPage();
}
function ownerPage(){
 const c=document.getElementById("content");
 if(page==="home"){
  c.innerHTML=`
  <h2>لوحة المالك</h2>
  <div class="notice">هذه نسخة تجريبية محلية. لا تعتمد عليها لتخزين بيانات عملاء حقيقية أو كلمات مرور.</div>
  <div class="grid">
   <div class="stat">إجمالي العملاء<strong>${db.clients.length}</strong></div>
   <div class="stat">الاشتراكات النشطة<strong>${db.clients.filter(active).length}</strong></div>
   <div class="stat">الاشتراكات المنتهية<strong>${db.clients.filter(x=>!active(x)).length}</strong></div>
   <div class="stat">إجمالي المبيعات<strong>${money(db.sales.reduce((a,x)=>a+x.total,0))}</strong></div>
  </div>
  <div class="panel" style="margin-top:17px">
   <h3>إدارة النظام</h3>
   <p class="muted">أنشئ حسابات العملاء وتابع اشتراكاتهم من لوحة المالك.</p>
   <button onclick="go('newclient')">إضافة عميل جديد</button>
   <button class="secondary" onclick="go('clients')">عرض العملاء</button>
  </div>`;
 }else if(page==="newclient"){
  c.innerHTML=`
  <div class="panel">
   <h2>إنشاء حساب كاشير لعميل</h2>
   <label>اسم المحل</label><input id="shopName" placeholder="اسم المحل">
   <label>اسم المستخدم</label><input id="shopUser" placeholder="اسم دخول العميل">
   <label>كلمة المرور</label><input id="shopPass" placeholder="كلمة مرور مؤقتة">
   <label>نوع الاشتراك</label>
   <select id="shopPlan">
    <option value="monthly">شهري - 100 جنيه</option>
    <option value="yearly">سنوي - 1000 جنيه</option>
    <option value="lifetime">شراء كامل - 3000 جنيه</option>
   </select>
   <button onclick="createClient()">إنشاء الحساب</button>
  </div>`;
 }else if(page==="clients"){
  c.innerHTML=`<h2>العملاء والاشتراكات</h2>
  <div class="panel tablewrap"><table><thead><tr><th>المحل</th><th>المستخدم</th><th>الاشتراك</th><th>الانتهاء</th><th>الحالة</th><th>إجراءات</th></tr></thead>
  <tbody>${db.clients.map(x=>`<tr>
   <td>${esc(x.shop)}</td><td>${esc(x.username)}</td>
   <td>${planName(x.plan)}</td>
   <td>${x.plan==="lifetime"?"دائم":new Date(x.endDate).toLocaleDateString("ar-EG")}</td>
   <td><span class="badge ${active(x)?"":"off"}">${active(x)?"نشط":"منتهي / موقوف"}</span></td>
   <td><div class="actions">
   <button onclick="renew('${x.id}')">تجديد</button>
   <button class="secondary" onclick="toggleClient('${x.id}')">${x.enabled?"إيقاف":"تفعيل"}</button>
   <button class="danger" onclick="deleteClient('${x.id}')">حذف</button>
   </div></td></tr>`).join("")}</tbody></table></div>`;
 }else if(page==="reports"){
  c.innerHTML=`<h2>تقارير النظام</h2><div class="grid">
  <div class="stat">عدد العملاء<strong>${db.clients.length}</strong></div>
  <div class="stat">عدد عمليات البيع<strong>${db.sales.length}</strong></div>
  <div class="stat">إجمالي المبيعات<strong>${money(db.sales.reduce((a,x)=>a+x.total,0))}</strong></div></div>`;
 }
}
function planName(p){return {monthly:"شهري",yearly:"سنوي",lifetime:"شراء كامل"}[p]||p;}
function active(x){
 return !!x.enabled&&(x.plan==="lifetime"||new Date(x.endDate)>=new Date());
}
function createClient(){
 const shop=document.getElementById("shopName").value.trim();
 const username=document.getElementById("shopUser").value.trim();
 const password=document.getElementById("shopPass").value;
 const plan=document.getElementById("shopPlan").value;
 if(!shop||!username||!password){alert("أكمل جميع البيانات");return;}
 if(username===OWNER_USER||db.clients.some(x=>x.username===username)){alert("اسم المستخدم مستخدم بالفعل");return;}
 const end=new Date();
 if(plan==="monthly")end.setMonth(end.getMonth()+1);
 if(plan==="yearly")end.setFullYear(end.getFullYear()+1);
 db.clients.push({id:crypto.randomUUID(),shop,username,password,plan,endDate:end.toISOString(),enabled:true});
 save();alert("تم إنشاء حساب العميل");go("clients");
}
function renew(id){
 const x=db.clients.find(a=>a.id===id);if(!x)return;
 if(x.plan==="lifetime"){alert("هذا الحساب شراء كامل");return;}
 const d=new Date(Math.max(Date.now(),new Date(x.endDate).getTime()));
 if(x.plan==="monthly")d.setMonth(d.getMonth()+1);
 else d.setFullYear(d.getFullYear()+1);
 x.endDate=d.toISOString();x.enabled=true;save();render();
}
function toggleClient(id){
 const x=db.clients.find(a=>a.id===id);if(!x)return;
 x.enabled=!x.enabled;save();render();
}
function deleteClient(id){
 if(!confirm("هل تريد حذف حساب العميل؟"))return;
 db.clients=db.clients.filter(x=>x.id!==id);save();render();
}
function shopProducts(){
 return db.products.filter(x=>x.shopId===current.shopId);
}
function cashierPage(){
 const c=document.getElementById("content");
 if(page==="home"||page==="products"){
  const products=shopProducts();
  c.innerHTML=`<h2>الكاشير - ${esc(current.name)}</h2>
  <div class="grid">
  ${products.map(x=>`<div class="product">
   <h3>${esc(x.name)}</h3><p>${money(x.price)}</p><p class="muted">المخزون: ${x.stock}</p>
   <button onclick="addCart('${x.id}')" ${x.stock<=0?"disabled":""}>إضافة للسلة</button>
  </div>`).join("")||"<p>لا توجد منتجات. أضف أول منتج.</p>"}</div>
  <div class="panel" style="margin-top:18px">
   <h3>إضافة منتج</h3>
   <label>اسم المنتج</label><input id="prodName" placeholder="اسم المنتج">
   <label>السعر</label><input id="prodPrice" type="number" min="0" placeholder="السعر">
   <label>الكمية</label><input id="prodStock" type="number" min="0" placeholder="الكمية">
   <button onclick="addProduct()">حفظ المنتج</button>
  </div>
  <div class="panel"><h3>سلة البيع</h3><div id="cartView"></div>
  <button onclick="checkout()">تأكيد البيع</button></div>`;
  showCart();
 }else if(page==="sales"){
  const sales=db.sales.filter(x=>x.shopId===current.shopId);
  c.innerHTML=`<h2>سجل المبيعات</h2><div class="panel tablewrap"><table>
  <tr><th>التاريخ</th><th>عدد المنتجات</th><th>الإجمالي</th></tr>
  ${sales.map(x=>`<tr><td>${new Date(x.date).toLocaleString("ar-EG")}</td><td>${x.items.length}</td><td>${money(x.total)}</td></tr>`).join("")}
  </table></div>`;
 }
}
function addProduct(){
 const name=document.getElementById("prodName").value.trim();
 const price=Number(document.getElementById("prodPrice").value);
 const stock=Number(document.getElementById("prodStock").value);
 if(!name||price<0||!Number.isFinite(price)||!Number.isInteger(stock)||stock<0){alert("راجع بيانات المنتج");return;}
 db.products.push({id:crypto.randomUUID(),shopId:current.shopId,name,price,stock});
 save();render();
}
function addCart(id){
 const p=shopProducts().find(x=>x.id===id);
 if(!p||p.stock<=0)return;
 const item=cart.find(x=>x.id===id);
 if(item){if(item.qty>=p.stock){alert("الكمية غير متوفرة");return;}item.qty++;}
 else cart.push({id,qty:1});
 showCart();
}
function showCart(){
 const el=document.getElementById("cartView");if(!el)return;
 let total=0;
 el.innerHTML=cart.map(i=>{
  const p=shopProducts().find(x=>x.id===i.id);if(!p)return "";
  total+=p.price*i.qty;
  return `<p>${esc(p.name)} × ${i.qty} — ${money(p.price*i.qty)}
  <button class="secondary" onclick="removeCart('${i.id}')">حذف</button></p>`;
 }).join("")+`<h3>الإجمالي: ${money(total)}</h3>`;
}
function removeCart(id){cart=cart.filter(x=>x.id!==id);showCart();}
function checkout(){
 if(!cart.length){alert("السلة فارغة");return;}
 let total=0,items=[];
 for(const i of cart){
  const p=shopProducts().find(x=>x.id===i.id);
  if(!p||p.stock<i.qty){alert("المخزون غير كافٍ");return;}
  p.stock-=i.qty;total+=p.price*i.qty;
  items.push({name:p.name,qty:i.qty,price:p.price});
 }
 db.sales.push({id:crypto.randomUUID(),shopId:current.shopId,date:new Date().toISOString(),items,total});
 cart=[];save();alert("تم تسجيل البيع: "+money(total));render();
}
</script>
</body>
</html>
