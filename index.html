<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيستم الصلاحي للمبيعات المتكامل</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        @media print {
            body * { visibility: hidden; }
            #printable-invoice, #printable-invoice * { visibility: visible; }
            #printable-invoice { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 bg-opacity-95 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-blue-500/30 mb-4">
                    <i class="fa-solid fa-cart-shopping text-white text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">سيستم الصلاحي للمبيعات</h2>
                <p class="text-slate-500 text-sm mt-1">سجل دخولك للوصول لنظام إدارة المبيعات</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">اسم المستخدم</label>
                    <input type="text" id="username" required placeholder="admin" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">كلمة السر</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>
                <p id="login-error" class="text-red-500 text-sm hidden">بيانات الدخول غير صحيحة! (الافتراضي: admin / 1243)</p>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition duration-200">
                    دخول للسيستم
                </button>
            </form>
        </div>
    </div>

    <!-- السيستم الرئيسي -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- الهيدر العلوي -->
        <header class="bg-slate-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-xl">🛒</div>
                    <div>
                        <h1 class="text-xl font-bold">الصلاحي للمبيعات</h1>
                        <p class="text-xs text-slate-400">نظام الكاشير والمخازن الذكي</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-sm bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">
                        <i class="fa-solid fa-user-circle text-blue-400 ml-1"></i> الأدمن (admin)
                    </span>
                    <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white px-3 py-1.5 rounded-lg text-sm border border-red-500/20 transition">
                        <i class="fa-solid fa-sign-out-alt"></i> خروج
                    </button>
                </div>
            </div>
        </header>

        <!-- التنقل والتخويب -->
        <div class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto">
                <button onclick="switchTab('pos')" id="tab-pos" class="tab-btn py-4 px-6 font-bold border-b-2 border-blue-600 text-blue-600 flex items-center gap-2">
                    <i class="fa-solid fa-cash-register"></i> نقطة البيع (الكاشير)
                </button>
                <button onclick="switchTab('products')" id="tab-products" class="tab-btn py-4 px-6 font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-boxes-stacked"></i> المخزون والمنتجات
                </button>
                <button onclick="switchTab('sales')" id="tab-sales" class="tab-btn py-4 px-6 font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-chart-line"></i> سجل المبيعات والتقارير
                </button>
            </div>
        </div>

        <!-- المحتوى الرئيسي -->
        <main class="max-w-7xl mx-auto p-4 md:p-6 flex-1 w-full">
            
            <!-- 1. شاشة الكاشير -->
            <div id="sec-pos" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- قائمة المنتجات للبيع -->
                <div class="lg:col-span-2 space-y-4">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex gap-3">
                        <input type="text" id="pos-search" oninput="renderPOSProducts()" placeholder="ابحث عن منتج بالاسم..." class="flex-1 px-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-
