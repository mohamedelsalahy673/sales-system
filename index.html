<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexPOS PRO</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{--bg:#f3f5fa;--card:#fff;--txt:#172033;--muted:#778196;--line:#e5e8ef;--primary:#5658dc;--green:#159b68;--red:#df4654}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Tahoma,Arial,sans-serif}
body.dark{--bg:#111827;--card:#1f2937;--txt:#f3f4f6;--muted:#aab3c2;--line:#374151;--primary:#8586ff}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
button:disabled{opacity:.5;cursor:not-allowed}
.auth{min-height:100vh;display:grid;place-items:center;padding:18px}
.authbox{width:min(440px,100%);background:var(--card);padding:25px;border-radius:18px;box-shadow:0 10px 35px #0001}
.logo{font-size:27px;font-weight:900;color:var(--primary);text-align:center}
.subtitle{text-align:center;color:var(--muted);margin:8px 0 22px;font-size:13px}
.field{margin:12px 0}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--txt);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--primary);color:white;font-weight:bold}
.btn.block{width:100%}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.gray{background:#6b7280}
.btn.light{background:#e9eaff;color:#4546b9}
.link{border:0;background:none;color:var(--primary);padding:8px}
.msg{padding:11px;border-radius:9px;margin:10px 0;font-size:13px;display:none}
.msg.show{display:block}
.msg.error{background:#ffe5e8;color:#a32232}
.msg.ok{background:#e2f8ed;color:#087c4a}
.top{height:65px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}
.topbrand{font-size:20px;font-weight:900;color:var(--primary)}
.topright{display:flex;align-items:center;gap:9px}
.iconbtn{border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--txt);padding:9px 12px}
.layout{display:flex;min-height:calc(100vh - 65px)}
.sidebar{width:245px;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);padding:13px;transition:.2s;overflow:hidden}
.sidebar.collapsed{width:70px}
.nav{display:grid;gap:5px}
.nav button{border:0;background:transparent;color:var(--muted);padding:13px 11px;text-align:right;border-radius:9px;white-space:nowrap}
.nav button.active,.nav button:hover{background:#eeeeff;color:var(--primary);font-weight:bold}
.nav .ico{display:inline-block;width:28px;font-size:17px}
.sidebar.collapsed .navtext{display:none}
.main{padding:20px;min-width:0;flex:1}
.page{display:none}
.page.active{display:block}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:17px}
.head h2{margin:0;font-size:21px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:14px}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:24px;margin-top:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:14px}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{text-align:right;padding:12px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);background:var(--bg)}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.actions .btn{padding:7px 9px;font-size:12px}
.badge{display:inline-block;border-radius:20px;padding:5px 9px;background:#e9eaff;color:#5556bd;font-size:11px}
.muted{color:var(--muted)}
.overlay{display:none}
.productline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
@media(max-width:800px){
 .sidebar{position:fixed;z-index:40;right:0;top:65px;bottom:0;width:260px;transform:translateX(110%);box-shadow:0 5px 30px #0002}
 .sidebar.open{transform:translateX(0)}
 .sidebar.collapsed{width:260px}
 .sidebar.collapsed .navtext{display:inline}
 .overlay.show{display:block;position:fixed;inset:65px 0 0;background:#0007;z-index:30}
 .main{padding:12px}
}
</style>
</head>
<body>

<section id="auth" class="auth">
 <div class="authbox">
  <div class="logo">NexPOS PRO</div>
  <div class="subtitle">نظام إدارة المحلات والمبيعات</div>
  <div id="authMsg" class="msg"></div>

  <div id="loginForm">
   <div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email"></div>
   <div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password"></div>
   <button class="btn block" onclick="login()">تسجيل الدخول</button>
   <div style="display:flex;justify-content:space-between;margin-top:12px">
    <button class="link" onclick="showRegister()">إنشاء حساب جديد</button>
    <button class="link" onclick="resetPassword()">نسيت كلمة المرور؟</button>
   </div>
  </div>

  <div id="registerForm" class="hidden">
   <div class="field"><label>اسم صاحب المحل</label><input id="regName"></div>
   <div class="field"><label>اسم المحل</label><input id="regShop"></div>
   <div class="field"><label>رقم الهاتف</label><input id="regPhone"></div>
   <div class="field"><label>البريد الإلكتروني</label><input id="regEmail" type="email"></div>
   <div class="field"><label>كلمة المرور (6 أحرف على الأقل)</label><input id="regPassword" type="password"></div>
   <button class="btn block" onclick="register()">إنشاء الحساب</button>
   <button class="link" onclick="showLogin()">العودة لتسجيل الدخول</button>
  </div>

  <div id="pendingForm" class="hidden">
   <h3>طلبك قيد المراجعة</h3>
   <p class="muted">تم إنشاء حسابك. انتظر تفعيل الاشتراك من إدارة النظام.</p>
   <p>للدعم: 01062883414</p>
   <button class="btn block" onclick="logout()">تسجيل الخروج</button>
  </div>
 </div>
</section>

<section id="app" class="hidden">
 <header class="top">
  <div style="display:flex;align-items:center;gap:12px">
   <button class="iconbtn" onclick="toggleMenu()">☰</button>
   <span class="topbrand">NexPOS PRO</span>
  </div>
  <div class="topright">
   <span id="userName" class="muted"></span>
   <button class="iconbtn" onclick="toggleTheme()">🌙</button>
   <button class="btn red" onclick="logout()">خروج</button>
  </div>
 </header>
 <div id="overlay" class="overlay" onclick="closeMenu()"></div>
 <div class="layout">
  <aside class="sidebar" id="sidebar">
   <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
 </div>
</section>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,deleteDoc,collection,getDocs,serverTimestamp,runTransaction} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyABpb7h1WXzodOKoxoRvvkXZSrPQ6UgZiA",
 authDomain:"nexpos-14155.firebaseapp.com",
 databaseURL:"https://nexpos-14155-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"nexpos-14155",
 storageBucket:"nexpos-14155.firebasestorage.app",
 messagingSenderId:"932284131293",
 appId:"1:932284131293:web:00d6237b1f155ae5daf834",
 measurementId:"G-ND249T5PTN"
};
const OWNER_EMAIL="melsalahy689@gmail.com";
const appFB=initializeApp(firebaseConfig);
const auth=getAuth(appFB),db=getFirestore(appFB);
const $=id=>document.getElementById(id);
let user=null,profile=null,shopId=null,isOwner=false;
let data={products:[],customers:[],sales:[],expenses:[],suppliers:[],purchases:[],returns:[]};
let cart=[],currentPage="home";

const fmt=n=>(Number(n)||0).toLocaleString("ar-EG",{maximumFractionDigits:2});
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const col=name=>collection(db,"shops",shopId,name);
const ref=(name,id)=>doc(db,"shops",shopId,name,id);

function message(text,type="error"){
 $("authMsg").textContent=text;$("authMsg").className="msg show "+type;
}
function errorText(e){
 const s=e?.code||e?.message||"حدث خطأ";
 if(s.includes("invalid-credential"))return "بيانات الدخول غير صحيحة";
 if(s.includes("email-already-in-use"))return "البريد مسجل بالفعل";
 if(s.includes("permission-denied"))return "ليس لديك صلاحية. راجع قواعد Firestore";
 return s;
}
window.showRegister=()=>{
 $("loginForm").classList.add("hidden");$("registerForm").classList.remove("hidden");$("pendingForm").classList.add("hidden");
};
window.showLogin=()=>{
 $("loginForm").classList.remove("hidden");$("registerForm").classList.add("hidden");$("pendingForm").classList.add("hidden");
};
window.login=async()=>{
 try{
  const email=$("loginEmail").value.trim(),password=$("loginPassword").value;
  if(!email||!password)throw Error("اكتب البريد وكلمة المرور");
  await signInWithEmailAndPassword(auth,email,password);
 }catch(e){message(errorText(e));}
};
window.register=async()=>{
 try{
  const name=$("regName").value.trim(),shop=$("regShop").value.trim();
  const phone=$("regPhone").value.trim(),email=$("regEmail").value.trim(),password=$("regPassword").value;
  if(!name||!shop||!email||!password)throw Error("أكمل البيانات المطلوبة");
  if(password.length<6)throw Error("كلمة المرور قصيرة");
  const result=await createUserWithEmailAndPassword(auth,email,password);
  await setDoc(doc(db,"users",result.user.uid),{
   customerName:name,shopName:shop,phone,email,role:"customer",
   status:"pending",subscriptionDays:0,createdAt:serverTimestamp()
  });
  message("تم إنشاء الحساب. طلبك في انتظار موافقة المالك","ok");
 }catch(e){message(errorText(e));}
};
window.resetPassword=async()=>{
 try{
  const email=$("loginEmail").value.trim();if(!email)throw Error("اكتب بريدك أولاً");
  await sendPasswordResetEmail(auth,email);message("تم إرسال رابط استعادة كلمة المرور","ok");
 }catch(e){message(errorText(e));}
};
window.logout=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
 if(!u){
  user=null;$("app").classList.add("hidden");$("auth").classList.remove("hidden");showLogin();return;
 }
 try{
  user=u;
  const snap=await getDoc(doc(db,"users",u.uid));
  if(!snap.exists())throw Error("لا يوجد ملف مستخدم لهذا الحساب");
  profile=snap.data();
  isOwner=profile.role==="owner"||u.email===OWNER_EMAIL;
  if(!isOwner&&profile.status!=="active"){
   $("auth").classList.remove("hidden");$("app").classList.add("hidden");
   $("loginForm").classList.add("hidden");$("registerForm").classList.add("hidden");$("pendingForm").classList.remove("hidden");
   return;
  }
  shopId=u.uid;
  $("auth").classList.add("hidden");$("app").classList.remove("hidden");
  $("userName").textContent=isOwner?"المالك":(profile.shopName||profile.customerName||u.email);
  await buildMenu();await loadData();openPage(isOwner?"owner":"home");
 }catch(e){console.error(e);message(errorText(e));}
});

const customerMenu=[
 ["home","🏠","الرئيسية"],["products","📦","المنتجات والمخزون"],
 ["sales","🛒","المبيعات"],["customers","👥","العملاء"],
 ["suppliers","🚚","الموردون"],["purchases","📥","المشتريات"],
 ["invoices","🧾","الفواتير"],["returns","↩️","المرتجعات"],
 ["expenses","💸","المصروفات"],["cashbox","💰","الخزينة"],
 ["reports","📊","التقارير"],["settings","⚙️","الإعدادات"],["subscription","⭐","اشتراكي"]
];
const ownerMenu=[["owner","👑","لوحة المالك"],["ownerSettings","⚙️","إعدادات النظام"]];

async function buildMenu(){
 const items=isOwner?ownerMenu:customerMenu;
 $("nav").innerHTML=items.map(([id,ico,label])=>
  `<button data-page="${id}" onclick="openPage('${id}')"><span class="ico">${ico}</span><span class="navtext">${label}</span></button>`
 ).join("");
}
window.openPage=id=>{
 currentPage=id;
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===id));
 renderPage();closeMenu();
};

async function loadData(){
 if(isOwner){return;}
 const names=Object.keys(data);
 await Promise.all(names.map(async name=>{
  const snap=await getDocs(col(name));
  data[name]=snap.docs.map(d=>({id:d.id,...d.data()}));
 }));
}
function cardStat(label,value){return `<div class="card stat"><small>${label}</small><strong>${value}</strong></div>`;}
function table(headers,rows){
 return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows||""}</tbody></table></div>`;
}
function pageHead(title,extra=""){return `<div class="head"><h2>${title}</h2>${extra}</div>`;}
function renderPage(){
 const main=$("main");
 if(isOwner){renderOwnerPage();return;}
 const products=data.products,customers=data.customers,sales=data.sales,expenses=data.expenses;
 const revenue=sales.reduce((s,x)=>s+(Number(x.total)||0),0);
 const exp=expenses.reduce((s,x)=>s+(Number(x.amount)||0),0);
 let html="";
 switch(currentPage){
 case "home":
  html=pageHead("لوحة تحكم المحل")+`<div class="cards">
  ${cardStat("إجمالي المبيعات",fmt(revenue)+" ج.م")}
  ${cardStat("عدد المنتجات",products.length)}
  ${cardStat("عدد العملاء",customers.length)}
  ${cardStat("المصروفات",fmt(exp)+" ج.م")}
  </div><div class="card"><h3>مرحباً بك في NexPOS PRO</h3><p class="muted">تابع نشاط محلك وأدر المبيعات والمخزون من مكان واحد.</p></div>`;
  break;
 case "products":
  html=pageHead("المنتجات والمخزون",`<button class="btn" onclick="productForm()">إضافة منتج</button>`)+
  `<div class="card" id="productFormBox" style="display:none"></div>`+
  table(["المنتج","الكود","الكمية","التكلفة","سعر البيع","إجراءات"],products.map(p=>`<tr>
  <td>${safe(p.name)}</td><td>${safe(p.code)}</td><td>${fmt(p.qty)}</td><td>${fmt(p.cost)}</td><td>${fmt(p.price)}</td>
  <td class="actions"><button class="btn light" onclick="productForm('${p.id}')">تعديل</button><button class="btn red" onclick="removeItem('products','${p.id}')">حذف</button></td></tr>`).join(""));
  break;
 case "sales":
  html=pageHead("المبيعات")+`<div class="grid">
   <div class="card"><h3>المنتجات</h3><input id="saleSearch" placeholder="ابحث عن منتج" oninput="renderSaleList()"><div id="saleList"></div></div>
   <div class="card"><h3>سلة البيع</h3><div id="cartList"></div><hr><h3>الإجمالي: <span id="cartTotal">0</span> ج.م</h3>
   <div class="field"><label>العميل</label><input id="saleCustomer" placeholder="عميل نقدي"></div>
   <div class="field"><label>طريقة الدفع</label><select id="salePayment"><option>نقدي</option><option>بطاقة</option><option>تحويل</option><option>آجل</option></select></div>
   <button class="btn green block" onclick="finishSale()">حفظ الفاتورة</button></div></div>`;
  break;
 case "customers":
  html=pageHead("العملاء",`<button class="btn" onclick="simpleAdd('customers')">إضافة عميل</button>`)+
  table(["الاسم","الهاتف","العنوان","إجراء"],customers.map(x=>`<tr><td>${safe(x.name)}</td><td>${safe(x.phone)}</td><td>${safe(x.address)}</td><td><button class="btn red" onclick="removeItem('customers','${x.id}')">حذف</button></td></tr>`).join(""));
  break;
 case "suppliers":
  html=pageHead("الموردون",`<button class="btn" onclick="simpleAdd('suppliers')">إضافة مورد</button>`)+
  table(["الاسم","الهاتف","العنوان","إجراء"],data.suppliers.map(x=>`<tr><td>${safe(x.name)}</td><td>${safe(x.phone)}</td><td>${safe(x.address)}</td><td><button class="btn red" onclick="removeItem('suppliers','${x.id}')">حذف</button></td></tr>`).join(""));
  break;
 case "purchases":
  html=pageHead("المشتريات",`<button class="btn" onclick="newPurchase()">تسجيل مشتريات</button>`)+
  table(["التاريخ","المورد","البيان","الإجمالي"],data.purchases.map(x=>`<tr><td>${dateOf(x)}</td><td>${safe(x.supplier)}</td><td>${safe(x.description)}</td><td>${fmt(x.total)}</td></tr>`).join(""));
  break;
 case "invoices":
  html=pageHead("الفواتير")+table(["رقم الفاتورة","التاريخ","العميل","الدفع","الإجمالي","عرض"],sales.map(x=>`<tr><td>${safe(x.invoiceNo)}</td><td>${dateOf(x)}</td><td>${safe(x.customer)}</td><td>${safe(x.payment)}</td><td>${fmt(x.total)}</td><td><button class="btn light" onclick="showInvoice('${x.id}')">عرض</button></td></tr>`).join(""));
  break;
 case "returns":
  html=pageHead("المرتجعات",`<button class="btn" onclick="newReturn()">تسجيل مرتجع</button>`)+
  table(["التاريخ","رقم الفاتورة","السبب","القيمة"],data.returns.map(x=>`<tr><td>${dateOf(x)}</td><td>${safe(x.invoiceNo)}</td><td>${safe(x.reason)}</td><td>${fmt(x.amount)}</td></tr>`).join(""));
  break;
 case "expenses":
  html=pageHead("المصروفات",`<button class="btn" onclick="simpleAdd('expenses')">إضافة مصروف</button>`)+
  table(["البيان","التصنيف","المبلغ","التاريخ","إجراء"],expenses.map(x=>`<tr><td>${safe(x.name)}</td><td>${safe(x.category)}</td><td>${fmt(x.amount)}</td><td>${dateOf(x)}</td><td><button class="btn red" onclick="removeItem('expenses','${x.id}')">حذف</button></td></tr>`).join(""));
  break;
 case "cashbox":
  html=pageHead("الخزينة")+`<div class="cards">${cardStat("إجمالي المقبوضات",fmt(sales.filter(x=>x.payment==="نقدي").reduce((s,x)=>s+(Number(x.total)||0),0))+" ج.م")}${cardStat("المصروفات النقدية",fmt(exp)+" ج.م")}${cardStat("الرصيد التقريبي",fmt(sales.filter(x=>x.payment==="نقدي").reduce((s,x)=>s+(Number(x.total)||0),0)-exp)+" ج.م")}</div>`;
  break;
 case "reports":
  const cost=sales.reduce((s,x)=>s+(Number(x.cost)||0),0);
  html=pageHead("التقارير")+`<div class="cards">${cardStat("الإيرادات",fmt(revenue)+" ج.م")}${cardStat("تكلفة البضاعة",fmt(cost)+" ج.م")}${cardStat("المصروفات",fmt(exp)+" ج.م")}${cardStat("صافي الربح التقريبي",fmt(revenue-cost-exp)+" ج.م")}</div>
  <div class="card"><p class="muted">الأرقام محسوبة من الفواتير والمصروفات المسجلة في النظام.</p></div>`;
  break;
 case "settings":
  html=pageHead("إعدادات المحل")+`<div class="card"><div class="field"><label>اسم المحل</label><input id="setShop" value="${safe(profile.shopName)}"></div>
  <div class="field"><label>رقم الهاتف</label><input id="setPhone" value="${safe(profile.phone)}"></div>
  <div class="field"><label>عنوان المحل</label><input id="setAddress" value="${safe(profile.address)}"></div>
  <button class="btn" onclick="saveShopSettings()">حفظ الإعدادات</button></div>`;
  break;
 case "subscription":
  html=pageHead("اشتراكي")+`<div class="card"><h3>حالة الاشتراك: <span class="badge">${safe(profile.status)}</span></h3>
  <p>الأيام المسجلة: ${fmt(profile.subscriptionDays||0)}</p><p class="muted">لتجديد الاشتراك تواصل مع إدارة النظام.</p>
  <p>الدفع عبر Cash أو InstaPay على الرقم: <b>01062883414</b></p></div>`;
  break;
 }
 main.innerHTML=html;
 if(currentPage==="sales"){renderSaleList();renderCart();}
}
function dateOf(x){return x.createdAt?.toDate?x.createdAt.toDate().toLocaleString("ar-EG"):"—";}

function renderOwnerPage(){
 const main=$("main");
 main.innerHTML=pageHead("لوحة المالك 👑")+`
 <div class="cards">
 ${cardStat("إجمالي الحسابات",$("ownerUsersCount")?.textContent||"—")}
 ${cardStat("طلبات الانتظار",$("ownerPendingCount")?.textContent||"—")}
 </div>
 <div class="card"><button class="btn" onclick="loadOwner()">تحديث القائمة</button>
 <div id="ownerTable"></div></div>`;
 loadOwner();
}
window.loadOwner=async()=>{
 try{
  const snap=await getDocs(collection(db,"users"));
  const users=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.role!=="owner");
  const pending=users.filter(x=>x.status==="pending").length;
  $("main").querySelector(".cards").innerHTML=cardStat("إجمالي الحسابات",users.length)+cardStat("طلبات الانتظار",pending)+cardStat("الحسابات النشطة",users.filter(x=>x.status==="active").length);
  $("ownerTable").innerHTML=table(["المحل","صاحب الحساب","البريد","الهاتف","الحالة","الاشتراك","الإجراءات"],users.map(u=>`<tr>
  <td>${safe(u.shopName)}</td><td>${safe(u.customerName)}</td><td>${safe(u.email)}</td><td>${safe(u.phone)}</td>
  <td>${safe(u.status)}</td><td>${fmt(u.subscriptionDays)} يوم</td>
  <td class="actions">
  <button class="btn green" onclick="changeSubscription('${u.id}','active')">تفعيل</button>
  <button class="btn light" onclick="extendSubscription('${u.id}')">تمديد</button>
  <button class="btn red" onclick="changeSubscription('${u.id}','blocked')">إيقاف</button>
  <button class="btn gray" onclick="changeSubscription('${u.id}','pending')">تعليق</button>
  </td></tr>`).join(""));
 }catch(e){$("ownerTable").textContent=errorText(e);}
};
window.changeSubscription=async(id,status)=>{
 if(!confirm("تأكيد تغيير حالة الحساب؟"))return;
 let days;
 if(status==="active"){days=Number(prompt("مدة الاشتراك بالأيام","30"));if(!days||days<1)return;}
 const update={status};
 if(days)update.subscriptionDays=days;
 await updateDoc(doc(db,"users",id),update);await loadOwner();
};
window.extendSubscription=async id=>{
 const days=Number(prompt("عدد الأيام المراد إضافتها"));
 if(!days||days<1)return;
 const r=doc(db,"users",id),s=await getDoc(r);
 await updateDoc(r,{status:"active",subscriptionDays:(Number(s.data().subscriptionDays)||0)+days});
 await loadOwner();
};

 ${field("اسم المنتج","fName",p.name)}

function field(label,id,value="",type="text"){
 return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${safe(value)}"></div>`;
}
window.saveProduct=async id=>{
 const name=$("fName").value.trim();if(!name)return alert("اكتب اسم المنتج");
 const item={name,code:$("fCode").value,barcode:$("fBarcode").value,category:$("fCategory").value,brand:$("fBrand").value,unit:$("fUnit").value,cost:Number($("fCost").value)||0,price:Number($("fPrice").value)||0,wholesale:Number($("fWholesale").value)||0,qty:Number($("fQty").value)||0,minQty:Number($("fMin").value)||0,supplier:$("fSupplier").value,updatedAt:serverTimestamp()};
 if(id)await updateDoc(ref("products",id),item);else await addDoc(col("products"),{...item,createdAt:serverTimestamp()});
 await refresh("products");
};
window.simpleAdd=async type=>{
 let name=prompt(type==="expenses"?"بيان المصروف":type==="customers"?"اسم العميل":"اسم المورد");
 if(!name)return;
 let item={name,createdAt:serverTimestamp()};
 if(type==="expenses"){
  const amount=Number(prompt("قيمة المصروف"));if(!amount||amount<=0)return;
  item={name,amount,category:prompt("تصنيف المصروف")||"",createdAt:serverTimestamp()};
 }else{
  item.phone=prompt("رقم الهاتف")||"";item.address=prompt("العنوان")||"";
 }
 await addDoc(col(type),item);await refresh(type);
};
window.removeItem=async(type,id)=>{
 if(!confirm("هل تريد الحذف؟"))return;
 await deleteDoc(ref(type,id));await refresh(type);
};
async function refresh(type){
 const snap=await getDocs(col(type));data[type]=snap.docs.map(d=>({id:d.id,...d.data()}));renderPage();
};

window.renderSaleList=()=>{
 const q=($("saleSearch")?.value||"").toLowerCase();
 $("saleList").innerHTML=data.products.filter(p=>(p.name||"").toLowerCase().includes(q)||(p.code||"").toLowerCase().includes(q)).map(p=>`<div class="productline"><span>${safe(p.name)}<br><small class="muted">${fmt(p.price)} ج.م | المتاح ${fmt(p.qty)}</small></span><button class="btn" onclick="addCart('${p.id}')">إضافة</button></div>`).join("");
};
window.addCart=id=>{
 const p=data.products.find(x=>x.id===id);if(!p)return;
 const old=cart.find(x=>x.id===id);
 if((old?.qty||0)+1>Number(p.qty))return alert("الكمية غير متاحة");
 if(old)old.qty++;else cart.push({id,name:p.name,price:Number(p.price)||0,cost:Number(p.cost)||0,qty:1});
 renderCart();
};
window.cartChange=(id,step)=>{
 const x=cart.find(i=>i.id===id);if(!x)return;
 x.qty+=step;if(x.qty<=0)cart=cart.filter(i=>i.id!==id);
 const p=data.products.find(i=>i.id===id);
 if(x.qty>Number(p.qty)){x.qty=Number(p.qty);alert("الكمية غير متاحة");}
 renderCart();
};
function renderCart(){
 if(!$("cartList"))return;
 $("cartList").innerHTML=cart.map(x=>`<div class="productline"><span>${safe(x.name)}<br>${fmt(x.price)} × ${x.qty}</span><span><button class="iconbtn" onclick="cartChange('${x.id}',-1)">−</button> ${x.qty} <button class="iconbtn" onclick="cartChange('${x.id}',1)">+</button></span></div>`).join("")||"السلة فارغة";
 $("cartTotal").textContent=fmt(cart.reduce((s,x)=>s+x.price*x.qty,0));
}
window.finishSale=async()=>{
 if(!cart.length)return alert("السلة فارغة");
 const items=cart.map(x=>({...x})),total=items.reduce((s,x)=>s+x.price*x.qty,0);
 const saleRef=doc(col("sales"));
 try{
  await runTransaction(db,async tx=>{
   const refs=items.map(x=>ref("products",x.id)),snaps=[];
   for(const r of refs)snaps.push(await tx.get(r));
   snaps.forEach((s,i)=>{if(!s.exists()||(Number(s.data().qty)||0)<items[i].qty)throw Error("الكمية غير كافية: "+items[i].name);});
   snaps.forEach((s,i)=>tx.update(refs[i],{qty:(Number(s.data().qty)||0)-items[i].qty}));
   tx.set(saleRef,{invoiceNo:"INV-"+Date.now(),items,total,cost:items.reduce((s,x)=>s+x.cost*x.qty,0),customer:$("saleCustomer").value||"عميل نقدي",payment:$("salePayment").value,createdAt:serverTimestamp()});
  });
  cart=[];await loadData();openPage("invoices");alert("تم حفظ الفاتورة");
 }catch(e){alert(errorText(e));}
};
window.showInvoice=id=>{
 const s=data.sales.find(x=>x.id===id);if(!s)return;
 const w=window.open("","_blank");
 w.document.write(`<html dir="rtl"><meta charset="UTF-8"><body style="font-family:Tahoma;padding:25px"><h2>${safe(profile.shopName||"NexPOS PRO")}</h2><p>فاتورة ${safe(s.invoiceNo)}</p><p>العميل: ${safe(s.customer)}</p><table border="1" cellpadding="8" width="100%"><tr><th>المنتج</th><th>الكمية</th><th>السعر</th></tr>${(s.items||[]).map(x=>`<tr><td>${safe(x.name)}</td><td>${x.qty}</td><td>${fmt(x.price)}</td></tr>`).join("")}</table><h3>الإجمالي: ${fmt(s.total)} جنيه</h3><button onclick="print()">طباعة</button></body></html>`);
 w.document.close();
};
window.newPurchase=async()=>{
 const supplier=prompt("اسم المورد")||"",description=prompt("تفاصيل المشتريات")||"";
 const total=Number(prompt("إجمالي المشتريات"));if(!total||total<=0)return;
 await addDoc(col("purchases"),{supplier,description,total,createdAt:serverTimestamp()});
 await refresh("purchases");
};
window.newReturn=async()=>{
 const invoiceNo=prompt("رقم الفاتورة")||"",reason=prompt("سبب المرتجع")||"";
 const amount=Number(prompt("قيمة المرتجع"));if(!amount||amount<=0)return;
 await addDoc(col("returns"),{invoiceNo,reason,amount,createdAt:serverTimestamp()});

};

window.toggleMenu=()=>{
 if(innerWidth<=800){$("sidebar").classList.toggle("open");$("overlay").classList.toggle("show");}
 else $("sidebar").classList.toggle("collapsed");
};

window.toggleTheme=()=>{

if(localStorage.getItem("nexpos-theme")==="dark")document.body.classList.add("dark");
