<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexPOS PRO - منصة إدارة الأنشطة والخدمات</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; direction: rtl; text-align: right; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { font-size: 24px; color: #38bdf8; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn { background: #0ea5e9; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn:hover { background: #0284c7; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>NexPOS PRO V11</h1>
            <span>أهلاً بك، الصلاحي</span>
        </header>

        <div class="card">
            <h2>لوحة التحكم الرئيسية</h2>
            <p>منصة إدارة الأنشطة والخدمات (الرومات، صالة VIP، القاعدة العربي، المبيعات).</p>
            <button class="btn" onclick="alert('تم تفعيل النظام بنجاح!')">بدء التشغيل</button>
        </div>
    </div>

    <script>
        console.log("NexPOS PRO Initialized Successfully.");
    </script>
</body>
</html>
