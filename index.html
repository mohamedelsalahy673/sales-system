

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexPOS PRO</title>
<style>
:root{--main:#2563eb;--dark:#111827;--bg:#f4f6fa;--white:#fff;--muted:#64748b;--line:#e5e7eb;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--dark)}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:#fff;width:100%;max-width:440px;padding:30px;border-radius:20px;box-shadow:0 10px 40px #0f172a12}
.logo{font-size:27px;font-weight:900;color:var(--main);letter-spacing:-1px}
.sub{color:var(--muted);font-size:13px;margin:8px 0 22px}
.field{margin:12px 0}
.field label{display:block;font-size:13px;margin-bottom:7px;font-weight:bold}
.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff}
.field input:focus,.field select:focus{border-color:var(--main)}
.btn{padding:12px 17px;border-radius:10px;background:var(--main);color:white;font-weight:bold}
.btn.secondary{background:#e8efff;color:var(--main)}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.success{background:#dcfce7;color:#166534}
.btn.block{width:100%}
.switch{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
.switch a{color:var(--main);cursor:pointer;font-weight:bold}
.credit{text-align:center;border-top:1px solid var(--line);margin-top:22px;padding-top:17px;font-size:12px;color:#64748b}
.credit strong{color:#334155}
.app{display:flex;min-height:100vh}
.sidebar{width:245px;background:#111827;color:#fff;padding:22px 15px;flex-shrink:0}
.brand{font-size:23px;font-weight:900;padding:7px 10px 25px;color:#fff}
.brand span{color:#60a5fa}
.nav-title{font-size:11px;color:#94a3b8;padding:15px 10px 8px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:9px;background:transparent;color:#cbd5e1;text-align:right;margin:3px 0}
.nav button.active,.nav button:hover{background:#263449;color:#fff}
.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.main{flex:1;min-width:0}
.topbar{background:#fff;padding:17px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:10px}
.topbar h2{margin:0;font-size:19px}
.content{padding:25px;max-width:1400px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:27px;margin-top:10px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.panel h3{margin:0 0 15px;font-size:16px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{text-align:right;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);background:#f8fafc}
.status{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;background:#fef3c7;color:#92400e}
.status.active{background:#dcfce7;color:#166534}
.status.expired,.status.rejected{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions button{padding:8px 10px;font-size:12px;border-radius:8px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.notice{padding:13px;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-size:13px;line-height:1.8;margin-bottom:15px}
.empty{padding:25px;text-align:center;color:var(--muted)}
.mobile-menu{display:none}
@media(max-width:750px){
 .sidebar{position:fixed;z-index:5;right:-260px;top:0;bottom:0;transition:.25s}
 .sidebar.open{right:0}
 .mobile-menu{display:inline-block;background:#eff6ff;color:var(--main);padding:9px;border-radius:8px}
 .content{padding:15px}
 .topbar{padding:13px 15px}
}
</style>
</head>
<body>

<!-- تسجيل الدخول والتسجيل -->
<section id="authScreen" class="auth">
 <div class="auth-card">
  <div class="logo">NexPOS <span style="color:#111827">PRO</span></div>
  <div class="sub">نظام إدارة المبيعات والمخزون باحترافية</div>

  <div id="loginForm">
   <h3>تسجيل الدخول</h3>
   <div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" placeholder="name@example.com"></div>
   <div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" placeholder="كلمة المرور"></div>
   <button class="btn block" onclick="login()">دخول إلى حسابك</button>
   <div class="switch">ليس لديك حساب؟ <a onclick="showRegister()">إنشاء حساب جديد</a></div>
  </div>

  <div id="registerForm" class="hidden">
   <h3>إنشاء حساب عميل جديد</h3>
   <div class="field"><label>اسم صاحب المحل</label><input id="regName" placeholder="الاسم بالكامل"></div>
   <div class="field"><label>اسم المحل أو النشاط</label><input id="regShop" placeholder="اسم المحل"></div>
   <div class="field"><label>رقم الهاتف</label><input id="regPhone" type="tel" placeholder="01xxxxxxxxx"></div>
   <div class="field"><label>البريد الإلكتروني</label><input id="regEmail" type="email" placeholder="name@example.com"></div>
   <div class="field"><label>كلمة المرور</label><input id="regPassword" type="password" placeholder="6 أحرف على الأقل"></div>
   <button class="btn block" onclick="register()">إنشاء الحساب</button>
   <div class="switch">لديك حساب بالفعل؟ <a onclick="showLogin()">تسجيل الدخول</a></div>
  </div>

  <div class="credit">تم التطوير بواسطة <strong>المهندس محمد صلاح الصلاحي</strong></div>
 </div>
</section>

<!-- التطبيق -->
<div id="appScreen" class="app hidden">
 <aside class="sidebar" id="sidebar">
  <div class="brand">NexPOS <span>PRO</span></div>
  <div class="nav-title">القائمة الرئيسية</div>
  <nav class="nav" id="navigation"></nav>
  <div style="padding:25px 10px 5px">
   <button class="btn danger block" onclick="logout()">تسجيل الخروج</button>
  </div>
 </aside>
 <main class="main">
  <header class="topbar">
   <div style="display:flex;align-items:center;gap:12px">
    <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
    <h2 id="pageTitle">لوحة التحكم</h2>
   </div>
   <div id="userLabel" style="font-size:13px;color:#64748b"></div>
  </header>
  <div class="content" id="pageContent"></div>
 </main>
</div>

<div id="toast" style="position:fixed;bottom:20px;left:20px;z-index:20;background:#111827;color:#fff;padding:13px 18px;border-radius:10px;display:none;max-width:90%"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
 getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,
 onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
 getFirestore,doc,getDoc,setDoc,collection,addDoc,getDocs,
 updateDoc,serverTimestamp,Timestamp,query,orderBy,limit
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

/* إعدادات مشروع Firebase الحالي */
const firebaseConfig={
 apiKey:"AIzaSyABpb7h1WXzodOKoxoRvvkXZSrPQ6UgZiA",
 authDomain:"nexpos-14155.firebaseapp.com",
 databaseURL:"https://nexpos-14155-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"nexpos-14155",
 storageBucket:"nexpos-14155.firebasestorage.app",
 messagingSenderId:"932284131293",
 appId:"1:932284131293:web:00d6237b1f155ae5daf834",
 measurementId:"G-ND249T5PTN"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let profile=null;
let currentPage="dashboard";
let productsCache=[];
let customersCache=[];
let salesCache=[];

const $=id=>document.getElementById(id);
const money=n=>(Number(n)||0).toLocaleString("ar-EG")+" ج.م";
const dateText=d=>{
 if(!d)return "—";
 const x=d.toDate?d.toDate():new Date(d);
 return x.toLocaleDateString("ar-EG");
};
function toast(msg){
 $("toast").textContent=msg;
 $("toast").style.display="block";
 setTimeout(()=>$("toast").style.display="none",3500);
}
function showLogin(){
 $("loginForm").classList.remove("hidden");
 $("registerForm").classList.add("hidden");
}
function showRegister(){
 $("loginForm").classList.add("hidden");
 $("registerForm").classList.remove("hidden");
}
window.showLogin=showLogin;
window.showRegister=showRegister;

window.register=async()=>{
 const name=$("regName").value.trim();
 const shop=$("regShop").value.trim();
 const phone=$("regPhone").value.trim();
 const email=$("regEmail").value.trim();
 const password=$("regPassword").value;
 if(!name||!shop||!phone||!email||password.length<6){
  toast("من فضلك أكمل البيانات بشكل صحيح");
  return;
 }
 try{
  const result=await createUserWithEmailAndPassword(auth,email,password);
  await setDoc(doc(db,"users",result.user.uid),{
   customerName:name,shopName:shop,phone,email,
   role:"customer",status:"pending",
   subscriptionDays:0,subscriptionExpiresAt:null,
   createdAt:serverTimestamp()
  });
  toast("تم إنشاء الحساب. انتظر موافقة المالك وتفعيل الاشتراك.");
 }catch(e){toast(firebaseError(e));}
};

window.login=async()=>{
 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;
 if(!email||!password){toast("اكتب البريد وكلمة المرور");return;}
 try{await signInWithEmailAndPassword(auth,email,password);}
 catch(e){toast(firebaseError(e));}
};
window.logout=()=>signOut(auth);
window.toggleSidebar=()=>$("sidebar").classList.toggle("open");

function firebaseError(e){
 const errors={
  "auth/invalid-credential":"البريد الإلكتروني أو كلمة المرور غير صحيحة",
  "auth/email-already-in-use":"البريد الإلكتروني مستخدم بالفعل",
  "auth/weak-password":"كلمة المرور ضعيفة",
  "auth/invalid-email":"البريد الإلكتروني غير صحيح",
  "auth/network-request-failed":"تحقق من اتصال الإنترنت"
 };
 return errors[e.code]||e.message||"حدث خطأ غير متوقع";
}

onAuthStateChanged(auth,async user=>{
 if(!user){
  currentUser=null;profile=null;
  $("authScreen").classList.remove("hidden");
  $("appScreen").classList.add("hidden");
  return;
 }
 currentUser=user;
 try{
  const snap=await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()){
   toast("لم يتم العثور على بيانات الحساب");
   await signOut(auth);return;
  }
  profile=snap.data();
  if(profile.role!=="owner"){
   if(profile.status!=="active"){
    $("authScreen").classList.remove("hidden");
    $("appScreen").classList.add("hidden");
    toast(profile.status==="rejected"?"تم رفض طلب الاشتراك. تواصل مع الإدارة":"حسابك بانتظار موافقة المالك وتفعيل الاشتراك");
    await signOut(auth);return;
   }
   const expiry=profile.subscriptionExpiresAt?.toDate?.();
   if(!expiry||expiry.getTime()<Date.now()){
    await updateDoc(doc(db,"users",user.uid),{status:"expired"});
    toast("انتهى اشتراكك. يمكنك طلب التجديد بعد تسجيل الدخول مرة أخرى.");
    await signOut(auth);return;
   }
  }
  $("authScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  $("userLabel").textContent=profile.role==="owner"?"المالك: "+(profile.customerName||"NexPOS"):profile.shopName;
  buildNavigation();
  await navigate("dashboard");
 }catch(e){
  toast("تعذر تحميل الحساب: "+e.message);
 }
});

/* القوائم */
const ownerMenu=[
 ["dashboard","لوحة التحكم","▦"],
 ["accounts","إدارة العملاء","♙"],
 ["requests","طلبات الاشتراك","◷"],
 ["plans","إعدادات الاشتراك","⚙"],
 ["ownerInfo","بيانات المطور","ⓘ"]
];
const customerMenu=[
 ["dashboard","الرئيسية","▦"],
 ["products","المنتجات والمخزون","▤"],
 ["sales","المبيعات","▣"],
 ["customers","العملاء","♙"],
 ["invoices","الفواتير","▧"],
 ["subscription","اشتراكي","◷"]
];
function buildNavigation(){
 const items=profile.role==="owner"?ownerMenu:customerMenu;
 $("navigation").innerHTML=items.map(x=>`
 <button id="nav-${x[0]}" onclick="navigate('${x[0]}')">
 <span style="font-size:18px;width:22px">${x[2]}</span>${x[1]}</button>`).join("");
}
window.navigate=navigate;

async function navigate(page){
 currentPage=page;
 $("sidebar").classList.remove("open");
 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
 $("nav-"+page)?.classList.add("active");
 const names={
 dashboard:"لوحة التحكم",accounts:"إدارة العملاء",
 requests:"طلبات الاشتراك",plans:"إعدادات الاشتراك",
 ownerInfo:"بيانات المطور",products:"المنتجات والمخزون",
 sales:"المبيعات",customers:"العملاء",invoices:"الفواتير",
 subscription:"اشتراكي"
 };
 $("pageTitle").textContent=names[page]||"NexPOS PRO";
 $("pageContent").innerHTML='<div class="empty">جارٍ تحميل البيانات...</div>';
 try{
  if(profile.role==="owner")await ownerPage(page);
  else await customerPage(page);
 }catch(e){
  $("pageContent").innerHTML=`<div class="panel">حدث خطأ أثناء تحميل البيانات: ${e.message}</div>`;
 }
}

function stat(title,value){
 return `<div class="card stat"><small>${title}</small><strong>${value}</strong></div>`;
}
function panel(title,body){
 return `<section class="panel"><h3>${title}</h3>${body}</section>`;
}
function table(headers,rows){
 return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||""}</tbody></table></div>`;
}

/* لوحة المالك */
async function ownerPage(page){
 if(page==="dashboard"||page==="accounts"||page==="requests"){
  const snaps=await getDocs(collection(db,"users"));
  const users=snaps.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.role!=="owner");
  const pending=users.filter(u=>u.status==="pending");
  const active=users.filter(u=>u.status==="active");
  const expired=users.filter(u=>u.status==="expired"||u.status==="rejected");
  if(page==="dashboard"){
   $("pageContent").innerHTML=`
    <div class="grid">
     ${stat("إجمالي العملاء",users.length)}
     ${stat("اشتراكات نشطة",active.length)}
     ${stat("طلبات معلقة",pending.length)}
     ${stat("منتهية أو مرفوضة",expired.length)}
    </div>
    ${panel("آخر طلبات التسجيل",table(["اسم العميل","المحل","الهاتف","الحالة"],users.slice(0,8).map(u=>`
     <tr><td>${esc(u.customerName)}</td><td>${esc(u.shopName)}</td><td>${esc(u.phone)}</td><td>${statusLabel(u.status)}</td></tr>`).join("")))}
    <div class="notice">يمكنك مراجعة طلبات الاشتراك وتفعيل الحسابات من قسم إدارة العملاء.</div>`;
   return;
  }
  const filtered=page==="requests"?pending:users;
  $("pageContent").innerHTML=panel(page==="requests"?"طلبات الاشتراك المعلقة":"جميع حسابات العملاء",
   table(["العميل","اسم المحل","الهاتف","البريد","الحالة","الإجراءات"],
   filtered.map(u=>`<tr>
    <td>${esc(u.customerName)}</td><td>${esc(u.shopName)}</td>
    <td>${esc(u.phone)}</td><td>${esc(u.email)}</td>
    <td>${statusLabel(u.status)}</td>
    <td><div class="actions">
     <button class="btn success" onclick="activateCustomer('${u.id}')">تفعيل</button>
     <button class="btn secondary" onclick="extendCustomer('${u.id}')">تجديد</button>
     <button class="btn danger" onclick="blockCustomer('${u.id}')">إيقاف</button>
    </div></td></tr>`).join("")||`<tr><td colspan="6" class="empty">لا توجد حسابات هنا</td></tr>`)));
  return;
 }
 if(page==="plans"){
  const ref=doc(db,"systemSettings","subscription");
  const snap=await getDoc(ref);
  const s=snap.exists()?snap.data():{};
  $("pageContent").innerHTML=panel("إعدادات الاشتراك",`
   <div class="notice">بيانات الدفع التي تظهر للعملاء الجدد.</div>
   <div class="field"><label>رقم الدفع والتحويل InstaPay</label><input id="payPhone" value="${esc(s.paymentPhone||"01062883414")}"></div>
   <div class="field"><label>تعليمات الدفع</label><input id="payText" value="${esc(s.paymentText||"الدفع نقدًا أو عن طريق InstaPay")}"></div>
   <div class="field"><label>سعر الاشتراك الشهري (جنيه)</label><input id="planPrice" type="number" value="${Number(s.monthlyPrice||0)}"></div>
   <button class="btn" onclick="savePlans()">حفظ الإعدادات</button>`);
  return;
 }
 if(page==="ownerInfo"){
  $("pageContent").innerHTML=panel("بيانات المطور",`
   <h2>محمد صلاح الصلاحي</h2>
   <p>تم التطوير بواسطة المهندس محمد صلاح الصلاحي</p>
   <p>أولاد صقر، الشرقية، مصر</p>
   <p>الدعم الفني: 01062883414</p>
   <p>وسائل الدفع: Cash / InstaPay</p>`);
 }
}

function statusLabel(s){
 const labels={pending:"بانتظار الموافقة",active:"نشط",expired:"منتهي",rejected:"مرفوض",blocked:"موقوف"};
 const cls=s==="active"?"active":(s==="expired"||s==="rejected"||s==="blocked"?"expired":"");
 return `<span class="status ${cls}">${labels[s]||s||"غير محدد"}</span>`;
}
function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* إدارة الاشتراكات */
window.activateCustomer=async uid=>{
 const days=Number(prompt("مدة الاشتراك بالأيام:",30));
 if(!days||days<1){toast("أدخل مدة صحيحة");return;}
 try{
  const ref=doc(db,"users",uid);
  const snap=await getDoc(ref);
  const old=snap.data()?.subscriptionExpiresAt?.toDate?.();
  const base=old&&old.getTime()>Date.now()?old:new Date();
  base.setDate(base.getDate()+days);
  await updateDoc(ref,{
   status:"active",subscriptionDays:days,
   subscriptionExpiresAt:Timestamp.fromDate(base),
   activatedAt:serverTimestamp()
  });
  toast("تم تفعيل الاشتراك بنجاح");
  await navigate(currentPage);
 }catch(e){toast("تعذر التفعيل: "+e.message);}
};
window.extendCustomer=async uid=>{
 const days=Number(prompt("عدد أيام التجديد:",30));
 if(!days||days<1)return;
 try{
  const ref=doc(db,"users",uid);
  const snap=await getDoc(ref);
  const old=snap.data()?.subscriptionExpiresAt?.toDate?.();
  const base=old&&old.getTime()>Date.now()?old:new Date();
  base.setDate(base.getDate()+days);
  await updateDoc(ref,{
   status:"active",subscriptionDays:days,
   subscriptionExpiresAt:Timestamp.fromDate(base)
  });
  toast("تم تجديد الاشتراك");
  await navigate(currentPage);
 }catch(e){toast(e.message);}
};
window.blockCustomer=async uid=>{
 if(!confirm("هل تريد إيقاف هذا الحساب؟"))return;
 try{
  await updateDoc(doc(db,"users",uid),{status:"blocked"});
  toast("تم إيقاف الحساب");
  await navigate(currentPage);
 }catch(e){toast(e.message);}
};
window.savePlans=async()=>{
 try{
  await setDoc(doc(db,"systemSettings","subscription"),{
   paymentPhone:$("payPhone").value.trim(),
   paymentText:$("payText").value.trim(),
   monthlyPrice:Number($("planPrice").value||0),
   updatedAt:serverTimestamp()
  },{merge:true});
  toast("تم حفظ الإعدادات");
 }catch(e){toast(e.message);}
};

/* لوحة العميل */
const shopRef=name=>collection(db,"shops",currentUser.uid,name);
async function customerPage(page){
 if(page==="dashboard"){
  const [p,s,c]=await Promise.all([
   getDocs(shopRef("products")),getDocs(shopRef("sales")),getDocs(shopRef("customers"))
  ]);
  const products=p.docs.map(d=>d.data());
  const sales=s.docs.map(d=>d.data());
  const total=sales.reduce((a,x)=>a+Number(x.total||0),0);
  $("pageContent").innerHTML=`
   <div class="grid">
    ${stat("عدد المنتجات",products.length)}
    ${stat("عدد الفواتير",sales.length)}
    ${stat("إجمالي المبيعات",money(total))}
    ${stat("عدد العملاء",c.size)}
   </div>
   ${panel("مرحبًا بك في NexPOS PRO",`
    <p>إدارة نشاطك التجاري أصبحت أسهل.</p>
    <p>المحل: <strong>${esc(profile.shopName)}</strong></p>
    <p>صاحب الحساب: ${esc(profile.customerName)}</p>`)}
   `;
  return;
 }
 if(page==="products"){
  const snap=await getDocs(shopRef("products"));
  productsCache=snap.docs.map(d=>({id:d.id,...d.data()}));
  $("pageContent").innerHTML=`
   ${panel("إضافة منتج",`
    <div class="form-grid">
     <div class="field"><label>اسم المنتج</label><input id="pName"></div>
     <div class="field"><label>كود المنتج / الباركود</label><input id="pCode"></div>
     <div class="field"><label>سعر البيع</label><input id="pPrice" type="number"></div>
     <div class="field"><label>سعر التكلفة</label><input id="pCost" type="number"></div>
     <div class="field"><label>الكمية</label><input id="pQty" type="number"></div>

    <button class="btn" onclick="addProduct()">حفظ المنتج</button>`)}
   ${panel("قائمة المنتجات",table(["المنتج","الكود","سعر البيع","التكلفة","الكمية","الإجراء"],

    <td><button class="btn danger" onclick="deleteProduct('${p.id}')">حذف</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">لا توجد منتجات</td></tr>`))}
  `;
  return;
 }
 if(page==="sales"){
  const snap=await getDocs(shopRef("products"));
  productsCache=snap.docs.map(d=>({id:d.id,...d.data()}));
  $("pageContent").innerHTML=panel("تسجيل عملية بيع",`
   <div class="field"><label>اختر المنتج</label>
    <select id="saleProduct">${productsCache.map(p=>`<option value="${p.id}">${esc(p.name)} - ${money(p.price)} (المتاح ${p.qty})</option>`).join("")}</select>
   </div>

/* عمليات المنتجات */
window.addProduct=async()=>{
 const name=$("pName").value.trim();
 const code=$("pCode").value.trim();
 const price=Number($("pPrice").value);
 const cost=Number($("pCost").value);
 const qty=Number($("pQty").value);
 const minQty=Number($("pMin").value||5);
 if(!name||price<0||!Number.isFinite(qty)){toast("أكمل بيانات المنتج");return;}
 try{
  await addDoc(shopRef("products"),{
   name,code,price,cost,qty,minQty,
   createdAt:serverTimestamp()
  });
  toast("تم إضافة المنتج");
  await navigate("products");
 }catch(e){toast(e.message);}
};
window.deleteProduct=async id=>{
 if(!confirm("حذف المنتج؟"))return;
 try{
  const {deleteDoc}=await import("https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js");
  await deleteDoc(doc(db,"shops",currentUser.uid,"products",id));
  toast("تم حذف المنتج");
  await navigate("products");
 }catch(e){toast(e.message);}
};

/* المبيعات وتحديث المخزون */
window.makeSale=async()=>{
 const id=$("saleProduct").value;
 const qty=Number($("saleQty").value);
 const method=$("saleMethod").value;
 const p=productsCache.find(x=>x.id===id);
 if(!p||qty<1||qty>Number(p.qty)){toast("الكمية غير متاحة في المخزون");return;}
 try{
  const {runTransaction}=await import("https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js");
  await runTransaction(db,async tx=>{
   const ref=doc(db,"shops",currentUser.uid,"products",id);
   const snap=await tx.get(ref);
   if(!snap.exists()||Number(snap.data().qty)<qty)throw new Error("المخزون غير كافٍ");
   tx.update(ref,{qty:Number(snap.data().qty)-qty});
   const saleRef=doc(collection(db,"shops",currentUser.uid,"sales"));
   tx.set(saleRef,{
    invoiceNo:"NX-"+Date.now(),
    productId:id,productName:p.name,
    qty,price:Number(p.price),
    cost:Number(p.cost||0),
    total:Number(p.price)*qty,
    paymentMethod:method,
    createdAt:serverTimestamp()
   });
  });
  toast("تم تسجيل البيع وتحديث المخزون");
  await navigate("dashboard");
 }catch(e){toast("لم تتم عملية البيع: "+e.message);}
};

/* العملاء */
window.addCustomer=async()=>{
 const name=$("cName").value.trim();
 const phone=$("cPhone").value.trim();
 if(!name){toast("اكتب اسم العميل");return;}
 try{
  await addDoc(shopRef("customers"),{name,phone,createdAt:serverTimestamp()});
  toast("تم إضافة العميل");
  await navigate("customers");
 }catch(e){toast(e.message);}
};

/* طلب تجديد الاشتراك */
window.requestRenewal=async()=>{
 try{
  const requests=collection(db,"subscriptionRequests");
  await addDoc(requests,{
   uid:currentUser.uid,
   customerName:profile.customerName,
   shopName:profile.shopName,
   phone:profile.phone,
   email:profile.email,
   status:"pending",
   paymentMethod:"Cash / InstaPay",
   createdAt:serverTimestamp()
  });
  toast("تم إرسال طلب التجديد إلى المالك");
 }catch(e){toast("تعذر إرسال الطلب: "+e.message);}
};
</script>
