
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexPOS PRO</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f5f7fb;font-family:Arial,sans-serif}
header{background:#121e32;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #293b56}
.logo{font-size:24px;font-weight:bold;color:#70a5ff}
.container{max-width:1200px;margin:auto;padding:20px}
.card{background:#15243b;border:1px solid #2a3e5c;padding:20px;border-radius:15px;margin-bottom:16px}
.login{max-width:430px;margin:55px auto}
input,select{width:100%;padding:13px;background:#0d192c;color:white;border:1px solid #354967;border-radius:9px;margin:8px 0 15px}
label{font-size:13px;color:#bdcbe0}
button{border:0;border-radius:9px;padding:12px 16px;background:#3478ed;color:white;font-weight:bold;cursor:pointer;margin:4px}
button.secondary{background:#34445e}
button.danger{background:#b83d4b}
button:disabled{opacity:.5}
a{color:#8ab4ff;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px}
.stat{background:#203451;padding:19px;border-radius:12px}
.stat b{display:block;font-size:27px;color:#82afff;margin-top:10px}
.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;min-width:500px}
td,th{padding:12px;border-bottom:1px solid #34445e;text-align:right}
.scroll{overflow:auto}
.muted{color:#9cacc3;font-size:13px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.product{background:#203451;padding:14px;border-radius:12px}
.notice{background:#3b321b;color:#ffdf96;padding:12px;border-radius:9px;font-size:13px;margin-bottom:15px}
footer{text-align:center;padding:20px;color:#8798b0}
</style>
</head>
<body>

<header>
 <div class="logo">NexPOS PRO</div>
 <div id="headerUser" class="muted">Business Management System</div>
</header>

<section id="loginScreen" class="container">
 <div class="card login">
  <h2 id="loginTitle">تسجيل دخول المالك</h2>
  <p class="muted">مرحباً بك في نظام NexPOS PRO</p>
  <label>البريد الإلكتروني</label>
  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <label>كلمة المرور</label>
  <input id="password" type="password" placeholder="كلمة المرور">
  <button style="width:100%" onclick="login()">تسجيل الدخول</button>
  <p><a onclick="forgotPassword()">هل نسيت كلمة المرور؟</a></p>
  <hr style="border-color:#354967">
  <button class="secondary" onclick="setLoginMode('owner')">دخول المالك</button>
  <button class="secondary" onclick="setLoginMode('client')">دخول العميل</button>
  <p id="loginMessage" class="muted"></p>
 </div>
</section>

<section id="dashboard" class="container hidden">
 <div class="nav" id="nav"></div>
 <div id="view"></div>
</section>

<footer>NexPOS PRO © 2026 | Mohamed Elsalahy</footer>

<script>
// Firebase configuration
const firebaseConfig={
 apiKey:"AIzaSyABpb7h1WXzodOKoxoRvvkXZSrPQ6UgZiA",
 authDomain:"nexpos-14155.firebaseapp.com",
 databaseURL:"https://nexpos-14155-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"nexpos-14155",
 storageBucket:"nexpos-14155.firebasestorage.app",
 messagingSenderId:"932284131293",
 appId:"1:932284131293:web:00d6237b1f155ae5daf834",
 measurementId:"G-ND249T5PTN"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();

let mode="owner";
let user=null;
let profile=null;
let page="home";
let cart=[];

function setLoginMode(m){
 mode=m;
 document.getElementById("loginTitle").textContent=
 m==="owner"?"تسجيل دخول المالك":"تسجيل دخول العميل";
 document.getElementById("loginMessage").textContent="";
}

function msg(t){
 document.getElementById("loginMessage").textContent=t;
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const pass=document.getElementById("password").value;
 if(!email||!pass){msg("اكتب البريد الإلكتروني وكلمة المرور");return;}
 try{
  const result=await auth.signInWithEmailAndPassword(email,pass);
  user=result.user;
  const snap=await db.ref("users/"+user.uid).once("value");
  profile=snap.val();
  if(!profile){
   await auth.signOut();
   msg("الحساب لم يتم ربطه بملف مستخدم في النظام. تواصل مع المالك.");
   return;
  }
  if(mode==="owner"&&profile.role!=="owner"){
   await auth.signOut();msg("هذا الحساب ليس حساب المالك.");return;
  }
  if(mode==="client"&&profile.role!=="client"&&profile.role!=="cashier"){
   await auth.signOut();msg("هذا الحساب ليس حساب عميل.");return;
  }
  if(profile.enabled===false){
   await auth.signOut();msg("الحساب موقوف. تواصل مع الإدارة.");return;
  }
  if(profile.role!=="owner"&&profile.endDate&&
     Date.now()>new Date(profile.endDate).getTime()){
   await auth.signOut();msg("انتهى الاشتراك. يرجى التواصل مع الإدارة.");return;
  }
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  document.getElementById("headerUser").textContent=profile.name||email;
  page="home";render();
 }catch(e){msg(errorText(e));}
}

function errorText(e){
 const map={
 "auth/invalid-credential":"البريد الإلكتروني أو كلمة المرور غير صحيحة",
 "auth/user-not-found":"الحساب غير موجود",
 "auth/wrong-password":"كلمة المرور غير صحيحة",
 "auth/too-many-requests":"محاولات كثيرة. حاول لاحقاً",
 "auth/network-request-failed":"تحقق من اتصال الإنترنت"
 };
 return map[e.code]||e.message;
}

async function forgotPassword(){
 const email=document.getElementById("email").value.trim();
 if(!email){msg("اكتب بريدك الإلكتروني أولاً");return;}
 try{
  await auth.sendPasswordResetEmail(email);
  msg("تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني.");
 }catch(e){msg(errorText(e));}
}

function logout(){
 auth.signOut();
 user=null;profile=null;cart=[];
 document.getElementById("dashboard").classList.add("hidden");
 document.getElementById("loginScreen").classList.remove("hidden");
 document.getElementById("password").value="";
}

function go(p){page=p;render();}

function render(){
 const owner=profile.role==="owner";
 const items=owner?
 [["home","الرئيسية"],["clients","العملاء"],["addclient","إضافة عميل"],["subscriptions","الاشتراكات"],["reports","التقارير"]]:
 [["home","الرئيسية"],["products","المنتجات والمخزون"],["sales","المبيعات"],["customers","العملاء"],["expenses","المصروفات"],["reports","التقارير"]];
 document.getElementById("nav").innerHTML=
 items.map(x=>`<button class="secondary" onclick="go('${x[0]}')">${x[1]}</button>`).join("")+
 `<button class="danger" onclick="logout()">تسجيل خروج</button>`;
 if(owner)ownerPage();else clientPage();
}

function ownerPage(){
 const v=document.getElementById("view");
 if(page==="home"){
  v.innerHTML=`
  <h2>لوحة تحكم المالك</h2>
  <div class="notice">لوحة إدارة NexPOS PRO. لا تمنح حسابات المالك إلا للمستخدم المخوّل.</div>
  <div class="grid">
   <div class="stat">إجمالي العملاء<b id="countClients">...</b></div>
   <div class="stat">الاشتراكات النشطة<b id="countActive">...</b></div>
   <div class="stat">المبيعات<b id="countSales">...</b></div>
  </div>
  <div class="card"><h3>مرحباً بك في NexPOS PRO</h3>
  <p class="muted">تحكم في العملاء والاشتراكات من لوحة المالك.</p></div>`;
  loadOwnerStats();
 }
 if(page==="addclient"){
  v.innerHTML=`
  <div class="card"><h2>إضافة عميل جديد</h2>
  <p class="muted">إنشاء الحسابات يتطلب خادماً آمناً بصلاحيات المالك، ولا يمكن تنفيذه بأمان من صفحة GitHub وحدها.</p>
  <label>اسم المحل</label><input id="newShop" placeholder="اسم النشاط التجاري">
  <label>البريد الإلكتروني للعميل</label><input id="newEmail" type="email">
  <label>نوع النشاط</label>
  <select id="newType">
   <option>محل تجاري</option><option>سوبر ماركت</option>
   <option>مطعم وكافيه</option><option>ملابس</option>
   <option>موبايلات وإلكترونيات</option><option>صيدلية</option>
   <option>جملة وتجزئة</option><option>نشاط آخر</option>
  </select>
  <label>الباقة</label>
  <select id="newPlan">
   <option value="monthly">شهري - 100 جنيه</option>
   <option value="yearly">سنوي - 1000 جنيه</option>
   <option value="lifetime">شراء كامل - 3000 جنيه</option>
  </select>
  <button onclick="requestClient()">تجهيز طلب إنشاء الحساب</button>
  <p id="clientMessage" class="muted"></p></div>`;
 }
 if(page==="clients"||page==="subscriptions"){
  v.innerHTML=`<h2>العملاء والاشتراكات</h2>
  <div class="card"><p class="muted">قائمة العملاء تظهر بعد إعداد خدمة الإدارة الخلفية الآمنة وربط بيانات المحلات.</p></div>`;
 }
 if(page==="reports"){
  v.innerHTML=`<h2>تقارير النظام</h2><div class="card">التقارير ستظهر بعد ربط قاعدة بيانات المبيعات.</div>`;
 }
}

async function loadOwnerStats(){
 try{
  const s=await db.ref("shops").once("value");
  const shops=s.val()||{};
  const arr=Object.values(shops);
  document.getElementById("countClients").textContent=arr.length;
  document.getElementById("countActive").textContent=arr.filter(x=>x.enabled!==false).length;
  const sales=await db.ref("sales").once("value");
  document.getElementById("countSales").textContent=
   Object.keys(sales.val()||{}).length;
 }catch(e){
  document.getElementById("countClients").textContent="غير متاح";
  document.getElementById("countActive").textContent="غير متاح";
  document.getElementById("countSales").textContent="غير متاح";
 }
}

function requestClient(){
 const shop=document.getElementById("newShop").value.trim();
 const email=document.getElementById("newEmail").value.trim();
 const type=document.getElementById("newType").value;
 const plan=document.getElementById("newPlan").value;
 if(!shop||!email){alert("أكمل اسم المحل والبريد الإلكتروني");return;}
 document.getElementById("clientMessage").textContent=
 "تم تجهيز البيانات. يلزم تفعيل خدمة إنشاء الحسابات الخلفية الآمنة قبل إضافة العميل.";
}

function clientPage(){
 const v=document.getElementById("view");
 if(page==="home"||page==="products"){
  v.innerHTML=`
  <h2>إدارة النشاط التجاري</h2>
  <div class="grid">
   <div class="stat">المبيعات اليومية<b id="dailySales">0</b></div>
   <div class="stat">عدد المنتجات<b id="productCount">0</b></div>
   <div class="stat">الاشتراك<b>${profile.plan||"غير محدد"}</b></div>
  </div>
  <div class="card">
   <h3>إضافة منتج</h3>
   <label>اسم المنتج</label><input id="pName" placeholder="اسم المنتج">
   <label>الباركود</label><input id="pBarcode" placeholder="الباركود">
   <label>سعر البيع</label><input id="pPrice" type="number" min="0">
   <label>سعر الشراء</label><input id="pCost" type="number" min="0">
   <label>الكمية</label><input id="pStock" type="number" min="0">
   <button onclick="addProduct()">حفظ المنتج</button>
  </div>
  <div class="card"><h3>المنتجات</h3><div id="productList">جاري التحميل...</div></div>
  <div class="card"><h3>سلة البيع</h3><div id="cartList"></div><button onclick="checkout()">تأكيد البيع</button></div>`;
  loadProducts();
 }
 if(page==="sales"){
  v.innerHTML=`<h2>المبيعات</h2><div class="card" id="salesList">جاري التحميل...</div>`;
  loadSales();
 }
 if(page==="customers"){
  v.innerHTML=`<h2>العملاء</h2><div class="card">إدارة حسابات العملاء وأرصدتهم تحتاج تفعيل وحدة الحسابات الخلفية.</div>`;
 }
 if(page==="expenses"){
  v.innerHTML=`<h2>المصروفات والخزينة</h2><div class="card">
  <label>بيان المصروف</label><input id="expenseName">
  <label>القيمة</label><input id="expenseAmount" type="number">
  <button onclick="addExpense()">تسجيل المصروف</button></div><div id="expenseList"></div>`;
  loadExpenses();
 }
 if(page==="reports"){
  v.innerHTML=`<h2>التقارير</h2><div class="card">تقارير المبيعات والأرباح والمخزون تظهر بعد تسجيل العمليات.</div>`;
 }
}

function shopPath(path){
 return "shops/"+profile.shopId+"/"+path;
}

async function addProduct(){
 const name=document.getElementById("pName").value.trim();
 const price=Number(document.getElementById("pPrice").value);
 const cost=Number(document.getElementById("pCost").value);
 const stock=Number(document.getElementById("pStock").value);
 const barcode=document.getElementById("pBarcode").value.trim();
 if(!name||price<0||!Number.isFinite(price)||!Number.isInteger(stock)||stock<0||cost<0){
  alert("راجع بيانات المنتج");return;
 }
 try{
  await db.ref(shopPath("products")).push({
   name,price,cost,stock,barcode,createdAt:Date.now()
  });
  alert("تمت إضافة المنتج");
  loadProducts();
 }catch(e){alert("تعذر الحفظ: "+e.message);}
}

async function loadProducts(){
 try{
  const s=await db.ref(shopPath("products")).once("value");
  const data=s.val()||{};
  document.getElementById("productCount").textContent=Object.keys(data).length;
  document.getElementById("productList").innerHTML=
  Object.entries(data).map(([id,p])=>`
   <div class="product">
   <b>${escapeHTML(p.name)}</b>
   <p>${Number(p.price).toFixed(2)} جنيه</p>
   <p>المخزون: ${p.stock}</p>
   <button onclick="addCart('${id}','${escapeHTML(p.name)}',${p.price},${p.stock})">بيع</button>
   </div>`).join("")||"لا توجد منتجات";
 }catch(e){document.getElementById("productList").textContent="تعذر تحميل المنتجات: "+e.message;}
}

function addCart(id,name,price,stock){
 const item=cart.find(x=>x.id===id);
 if(item){if(item.qty>=stock){alert("الكمية غير متوفرة");return;}item.qty++;}
 else cart.push({id,name,price,qty:1,stock});
 drawCart();
}
function drawCart(){
 const el=document.getElementById("cartList");
 if(!el)return;
 el.innerHTML=cart.map(x=>`
 <p>${escapeHTML(x.name)} × ${x.qty} = ${(x.price*x.qty).toFixed(2)} جنيه
 <button class="secondary" onclick="removeCart('${x.id}')">حذف</button></p>`).join("");
 el.innerHTML+="<h3>الإجمالي: "+cart.reduce((a,x)=>a+x.price*x.qty,0).toFixed(2)+" جنيه</h3>";
}
function removeCart(id){cart=cart.filter(x=>x.id!==id);drawCart();}

async function checkout(){
 if(!cart.length){alert("السلة فارغة");return;}
 try{
  const productsSnap=await db.ref(shopPath("products")).once("value");
  const products=productsSnap.val()||{};
  for(const item of cart){
   if(!products[item.id]||products[item.id].stock<item.qty){
    alert("المخزون غير كافٍ");return;
   }
  }
  const total=cart.reduce((a,x)=>a+x.price*x.qty,0);
  const updates={};
  for(const item of cart){
   updates[shopPath("products/"+item.id+"/stock")]=products[item.id].stock-item.qty;
  }
  const sale={
   date:Date.now(),total,
   items:cart.map(x=>({name:x.name,qty:x.qty,price:x.price}))
  };
  const saleRef=db.ref(shopPath("sales")).push();
  updates[shopPath("sales/"+saleRef.key)]=sale;
  await db.ref().update(updates);
  cart=[];alert("تم تسجيل الفاتورة بنجاح");
  clientPage();
 }catch(e){alert("تعذر تسجيل البيع: "+e.message);}
}

async function loadSales(){
 try{
  const s=await db.ref(shopPath("sales")).once("value");
  const data=s.val()||{};
  const arr=Object.values(data);
  document.getElementById("salesList").innerHTML=
  "<h3>إجمالي المبيعات: "+arr.reduce((a,x)=>a+Number(x.total||0),0).toFixed(2)+" جنيه</h3>"+
  arr.map(x=>`<p>فاتورة: ${new Date(x.date).toLocaleString("ar-EG")} — ${x.total} جنيه</p>`).join("");
 }catch(e){document.getElementById("salesList").textContent="تعذر تحميل المبيعات: "+e.message;}
}

async function addExpense(){
 const name=document.getElementById("expenseName").value.trim();
 const amount=Number(document.getElementById("expenseAmount").value);
 if(!name||amount<=0){alert("أدخل بيانات صحيحة");return;}
 try{
  await db.ref(shopPath("expenses")).push({name,amount,date:Date.now()});
  alert("تم تسجيل المصروف");loadExpenses();
 }catch(e){alert("تعذر الحفظ: "+e.message);}
}
async function loadExpenses(){
 try{
  const s=await db.ref(shopPath("expenses")).once("value");
  const data=s.val()||{};
  document.getElementById("expenseList").innerHTML=
  Object.values(data).map(x=>`<div class="card">${escapeHTML(x.name)} — ${x.amount} جنيه</div>`).join("");
 }catch(e){document.getElementById("expenseList").textContent="تعذر تحميل المصروفات: "+e.message;}
}

function escapeHTML(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
</script>
</body>
</html>
