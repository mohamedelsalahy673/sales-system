function playBeep(freq=880, dur=200) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
    const ctx = new Ctx(); const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq; osc.type = "sine";
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur/1000);
    osc.start(); osc.stop(ctx.currentTime + dur/1000);
    setTimeout(() => ctx.close().catch(()=>{}), (dur+100));
  } catch(e){}
}
function playAlertSound() { playBeep(880,150); setTimeout(()=>playBeep(1200,150),180); setTimeout(()=>playBeep(880,150),360); }

function checkPsSubscriptionStatus() {
  const info = systemInfo(profile, "playstation");
  const expiry = info.expiryDate?.toDate ? info.expiryDate.toDate() : (info.expiryDate ? new Date(info.expiryDate) : null);
  if (!expiry) return;
  const today = new Date(); today.setHours(0, 0, 0, 0); 
  const expDate = new Date(expiry); expDate.setHours(0, 0, 0, 0); 
  const daysLeft = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
  const warningEl = $("psExpiryWarning");
  if (daysLeft <= 0) {
    warningEl.classList.add("hidden");
    showAlert("انتهى اشتراكك. يرجى التواصل مع المطور لتجديد الاشتراك.", "warning");
    setTimeout(() => logout(), 2000); return;
  }
  if (daysLeft <= 5) {
    warningEl.classList.remove("hidden");
    warningEl.innerHTML = `⚠️ تنبيه هام: باقي <b>${daysLeft}</b> أيام على انتهاء اشتراكك. يرجى التجديد لتجنب إيقاف الخدمة.<br><br>
    <button class="green" style="padding:8px 20px; font-size:14px;" onclick="requestRenewal()">تواصل مع المطور للتجديد</button>`;
  } else { warningEl.classList.add("hidden"); }
}

window.loadUsers=async()=>{
 try{
  const snap = await getDocs(collection(db,"users"));
  const list=snap.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.role!=="superowner");
  $("totalUsers").textContent=list.length;
  const salesList=list.filter(u=>systemInfo(u,"sales").status!=="not_registered");
  const psList=list.filter(u=>systemInfo(u,"playstation").status!=="not_registered");
  $("salesUsersCount").textContent=salesList.length;
  $("psUsersCount").textContent=psList.length;
  $("pendingUsersCount").textContent=list.reduce((c,u)=>c+(systemInfo(u,"sales").status==="pending"?1:0)+(systemInfo(u,"playstation").status==="pending"?1:0),0);
  const render=(arr,system)=>arr.map(u=>{
   const info=systemInfo(u,system),expiry=info.expiryDate?.toDate?info.expiryDate.toDate():info.expiryDate,expired=expiry&&new Date(expiry)<new Date();
   let statusText="قيد المراجعة",good=false;if(info.status==="active"&&!expired){statusText="نشط";good=true;}else if(info.status==="active"&&expired)statusText="منتهي";else if(info.status==="pending")statusText="طلب جديد";
   return `<tr><td>${escapeHTML(u.shopName||"")}</td><td>${escapeHTML(u.customerName||"")}</td><td>${escapeHTML(u.email||"")}</td><td>${escapeHTML(u.phone||"")}</td><td><span class="tag ${good?"good":""}">${statusText}</span></td><td>${escapeHTML(info.requestedPlan||info.plan||"غير محدد")}</td><td>${planControls(u,system)}</td></tr>`;
  }).join("")||'<tr><td colspan="7">لا يوجد عملاء</td></tr>';
  $("salesUsersTable").innerHTML=render(salesList,"sales");
  $("psUsersTable").innerHTML=render(psList,"playstation");
 }catch(e){ console.error(e); showAlert("حدث خطأ في قراءة البيانات: " + e.message, "error"); }
};

window.loadPlaystationData = async function(){
 if(!currentUser)return;
 try{
  const shiftRef = doc(db, shopRef(), "psShifts", "current");
  const [ds,is,ss,rs,shiftSnap]=await Promise.all([ 
      safeGetDocs(col("devices")), safeGetDocs(col("psItems")), safeGetDocs(col("psSessions")), 
      safeGetDocs(col("psReservations")), safeGetDoc(shiftRef) 
  ]);
  psDevices=ds.docs.map(d=>({id:d.id,...d.data()}));
  psItems=is.docs.map(d=>({id:d.id,...d.data()}));
  psSessions=ss.docs.map(d=>({id:d.id,...d.data()}));
  psReservations=rs.docs.map(d=>({id:d.id,...d.data()}));
  
  if(shiftSnap.exists()) {
     const shiftData = shiftSnap.data();
     const shiftDate = new Date(shiftData.closedAt).toISOString().slice(0,10);
     const today = new Date().toISOString().slice(0,10);
     if(shiftDate === today) currentShiftCloseTime = shiftData.closedAt;
     else currentShiftCloseTime = 0;
  } else {
     currentShiftCloseTime = 0;
  }
  renderPsDevices();renderPsItems();renderPsStats();renderPsSessions();
 }catch(e){ if(navigator.onLine)showAlert("تعذر تحميل البيانات: "+e.message, "error"); }
};

window.updatePsRate=async id=>{
 const input=$(`psRate_${id}`),rate=Number(input?.value);
 if(!Number.isFinite(rate)||rate<=0)return showAlert("أدخل سعر ساعة صحيح.", "warning");
 try{await updateDoc(docRef("devices",id),{hourlyRate:rate});await loadPlaystationData();showAlert("تم تحديث السعر.", "success");}catch(e){showAlert(e.message, "error");}
};
window.deletePsDevice=async id=>{
 const d=psDevices.find(x=>x.id===id);if(!d)return;
 if(d.status==="running")return showAlert("لا يمكن حذف جهاز يعمل.", "warning");
 if(!confirm("هل تريد حذف الجهاز؟"))return;
 try{await deleteDoc(docRef("devices",id));await loadPlaystationData();showAlert("تم الحذف.", "success");}catch(e){showAlert(e.message, "error");}
};

window.startPsDevice=async id=>{
 const d=psDevices.find(x=>x.id===id);
 if(!d||d.status==="running")return showAlert("الجهاز غير متاح.", "warning");
 
 const mode=$(`psMode_${id}`).value;
 const customerName = $(`psCustomerName_${id}`)?.value.trim() || "";
 const rate=Number(d.hourlyRate)||PS_DEFAULT_HOURLY_RATE;
 let minutes=0,plannedAmount=0,now=Date.now(),endAt=null;
 
 if(mode==="duration"){
  minutes=Number($(`psDuration_${id}`).value);
  if(!Number.isFinite(minutes)||minutes<PS_MIN_SESSION_MINUTES)return showAlert("أقل مدة نصف ساعة.", "warning");
  endAt=now+minutes*60000;
 }else if(mode==="amount"){
  plannedAmount=Number($(`psAmount_${id}`).value);
  const minimumAmount=rate*PS_MIN_SESSION_MINUTES/60;
  if(!Number.isFinite(plannedAmount)||plannedAmount<minimumAmount) return showAlert(`أقل مبلغ هو ${money(minimumAmount)} جنيه.`, "warning");
  minutes=Math.max(PS_MIN_SESSION_MINUTES,Math.ceil(plannedAmount/rate*60)); endAt=now+minutes*60000;
 }else{ minutes=0; endAt=null; }

 const sessionRef=doc(col("psSessions")),sessionId=sessionRef.id;
 try{
  Object.assign(d,{status:"running",startedAt:now,endAt,hourlyRate:rate,sessionId,sessionMode:mode,sessionAmount:plannedAmount,customerName});
  psSessions.push({id: sessionId, deviceId: id, deviceName: d.name, deviceType: window.getDeviceType(d), startedAt: now, endAt: endAt, plannedMinutes: minutes, hourlyRate: rate, sessionMode: mode, plannedAmount: mode === "amount" ? plannedAmount : 0, orders: [], finalized: false, createdAt: now, customerName});
  psAlertedDevices.delete(id);
  renderPsDevices(); renderPsStats(); renderPsSessions(); startPsTimer();
  setDoc(sessionRef,{deviceId:id,deviceName:d.name,deviceType:window.getDeviceType(d),startedAt:now,endAt,plannedMinutes:minutes,hourlyRate:rate,sessionMode:mode,plannedAmount:mode==="amount"?plannedAmount:0,orders:[],finalized:false,createdAt:now,customerName}).catch(e=>console.warn(e));
  updateDoc(docRef("devices",id),{status:"running",startedAt:now,endAt,lastDuration:minutes,hourlyRate:rate,sessionId,sessionMode:mode,sessionAmount:mode==="amount"?plannedAmount:0,customerName}).catch(e=>console.warn(e));
 }catch(e){console.error(e);showAlert("تعذر بدء الجلسة: "+e.message, "error");}
};

window.extendPsDevice=async id=>{
 const d=psDevices.find(x=>x.id===id);
 if(!d||d.status!=="running")return showAlert("الجهاز غير مشغل.", "warning");
 if(d.sessionMode==="auto")return showAlert("الجلسة بالحساب التلقائي.", "info");
 const minutes=Number($(`psExtend_${id}`).value);
 if(!Number.isFinite(minutes)||minutes<PS_MIN_SESSION_MINUTES)return showAlert("أقل مدة للتمديد نصف ساعة.", "warning");
 const now=Date.now(),newEndAt=Math.max(now,Number(d.endAt)||0)+minutes*60000;
 try{
  if(!d.sessionId)throw new Error("لا يوجد رقم جلسة.");
  const sRef=docRef("psSessions",d.sessionId);
  await runTransaction(db,async tx=>{
   const ss=await tx.get(sRef);
   if(!ss.exists()||ss.data().finalized)throw new Error("الجلسة غير متاحة للتمديد.");
   const old=ss.data(),addAmount=(minutes/60)*Number(old.hourlyRate||d.hourlyRate||PS_DEFAULT_HOURLY_RATE);
   tx.update(sRef,{endAt:newEndAt,plannedMinutes:Number(old.plannedMinutes||0)+minutes,plannedAmount:Number(old.plannedAmount||0)+(old.sessionMode==="amount"?addAmount:0),lastExtendedAt:now});
  });
  await updateDoc(docRef("devices",id),{endAt:newEndAt,lastExtendedAt:now});
  d.endAt=newEndAt; psAlertedDevices.delete(id); renderPsDevices(); if(navigator.onLine)loadPlaystationData().catch(e=>console.warn(e));
  showAlert("تم تمديد وقت الجهاز.", "success");
 }catch(e){showAlert("تعذر التمديد: "+e.message, "error");}
};

window.updateConfirmModalTotal = function() {
  const d = window.currentInvoiceToConfirm; if (!d) return;
  const discount = Math.max(0, Number(document.getElementById('psConfirmDiscountInput').value) || 0);
  const now = Date.now();
  const elapsedMinutes = Math.max(1, Math.ceil((now - Number(d.startedAt)) / 60000));
  let playTotal = 0;
  if (d.sessionMode === "amount") { playTotal = Number(d.sessionAmount || 0); }
  else if (d.sessionMode === "auto") { const halfHourBlocks = Math.max(1, Math.ceil((now - Number(d.startedAt)) / (PS_MIN_SESSION_MINUTES * 60000))); playTotal = (halfHourBlocks * PS_MIN_SESSION_MINUTES / 60) * Number(d.hourlyRate); }
  else { playTotal = (Math.max(PS_MIN_SESSION_MINUTES, elapsedMinutes) / 60) * Number(d.hourlyRate); }
  const orders = d.currentOrders || psSessions.find(s => s.id === d.sessionId)?.orders || [];
  const ordersTotal = orders.reduce((sum, o) => sum + Number(o.lineTotal ?? (o.price * o.qty)), 0);
  const finalTotal = Math.max(0, playTotal + ordersTotal - discount);
  const finalEl = document.getElementById('psConfirmFinalTotal');
  if (finalEl) { finalEl.innerHTML = `الإجمالي النهائي: ${money(finalTotal)} جنيه ${discount > 0 ? `<br><small style="color:#b72f3b; font-size:12px;">(شامل خصم ${money(discount)} ج)</small>` : ''}`; }
};

window.stopPsDevice=async id=>{
 const d=psDevices.find(x=>x.id===id); if(!d||d.status!=="running")return;
 window.currentInvoiceToConfirm = d;
 const now = Date.now(); const elapsedMinutes = Math.max(1, Math.ceil((now - Number(d.startedAt)) / 60000));
 let playTotal = 0;
 if(d.sessionMode === "amount") { playTotal = Number(d.sessionAmount || 0); }
 else if(d.sessionMode === "auto") { const halfHourBlocks = Math.max(1, Math.ceil((now - Number(d.startedAt)) / (PS_MIN_SESSION_MINUTES * 60000))); playTotal = (halfHourBlocks * PS_MIN_SESSION_MINUTES / 60) * Number(d.hourlyRate); }
 else { playTotal = (Math.max(PS_MIN_SESSION_MINUTES, elapsedMinutes) / 60) * Number(d.hourlyRate); }
 const orders = d.currentOrders || psSessions.find(s=>s.id===d.sessionId)?.orders || [];
 const ordersTotal = orders.reduce((sum,o)=> sum + Number(o.lineTotal ?? (o.price * o.qty)), 0);
 const total = playTotal + ordersTotal;
 const typeLabel = window.getDeviceType(d) === "vip" ? "صالة VIP" : (window.getDeviceType(d) === "base_arabi" ? "القاعدة العربي" : "روم");
 $("psConfirmInvoiceContent").innerHTML = `
   <b>الجهاز:</b> ${escapeHTML(d.name)} (${typeLabel})<br>
   <b>العميل:</b> ${escapeHTML(d.customerName||"غير محدد")}<br>
   <b>وقت اللعب:</b> ${elapsedMinutes} دقيقة<br><b>قيمة اللعب:</b> ${money(playTotal)} جنيه<br><hr style="margin: 8px 0;">
   <b>المشروبات والسندوتشات:</b><br>${orders.length ? orders.map(o => `- ${escapeHTML(o.name)} (${o.qty}) = ${money(o.lineTotal ?? (o.price * o.qty))} ج`).join('<br>') : 'لا يوجد'}
   <br><b>إجمالي الإضافات:</b> ${money(ordersTotal)} جنيه<br><hr style="margin: 8px 0; border-top: 2px dashed #ccc;">
   <h3 id="psConfirmFinalTotal" style="color:#178653; text-align:center; margin:5px 0;">الإجمالي النهائي: ${money(total)} جنيه</h3>`;
 const discountInput = $("psConfirmDiscountInput"); if(discountInput) discountInput.value = "";
 $("psConfirmInvoiceModal").classList.remove("hidden");
};

window.cancelPsInvoice = () => { $("psConfirmInvoiceModal").classList.add("hidden"); $("psConfirmInvoiceContent").innerHTML = ""; window.currentInvoiceToConfirm = null; };
window.confirmAndPrintPsInvoice = async (shouldPrint = true) => { $("psConfirmInvoiceModal").classList.add("hidden"); const invoice = window.currentInvoiceToConfirm; window.currentInvoiceToConfirm = null; if (invoice) { await finalizePsSession(invoice, "manual", shouldPrint); } };

window.addOrderToRoom = async (deviceId) => {
  const d = psDevices.find(x => x.id === deviceId);
  if (!d || d.status !== "running" || !d.sessionId) return showAlert("لا توجد جلسة نشطة.", "warning");
  const selectElement = document.getElementById(`orderItem_${deviceId}`); const qtyElement = document.getElementById(`orderQty_${deviceId}`);
  if (!selectElement || !selectElement.value) return showAlert("اختر الصنف أولاً.", "warning");
  const itemId = selectElement.value; const item = psItems.find(x => x.id === itemId);
  if (!item) return showAlert("الصنف غير موجود.", "error");
  const qty = Number(qtyElement?.value || 1); if (!Number.isInteger(qty) || qty <= 0) return showAlert("أدخل كمية صحيحة.", "warning");
  const price = Number(item.price) || 0;
  const session = psSessions.find(s => s.id === d.sessionId); const oldOrders = session?.orders || [];
  const newOrder = { itemId: item.id, name: item.name, category: item.category, qty: qty, price: price, lineTotal: Number((qty * price).toFixed(2)), addedAt: Date.now() };
  if (session) session.orders = [...oldOrders, newOrder];
  d.currentOrders = [...oldOrders, newOrder];
  renderPsDevices(); if (qtyElement) qtyElement.value = "1";
  const sRef = docRef("psSessions", d.sessionId);
  setDoc(sRef, { orders: [...oldOrders, newOrder], updatedAt: Date.now() }, { merge: true }).catch(e => console.warn(e));
};

window.removeRoomOrder = async(deviceId, index) => {
  const d = psDevices.find(x => x.id === deviceId); if (!d?.sessionId) return;
  if (!confirm("حذف هذا الطلب من الفاتورة؟")) return;
  const session = psSessions.find(s => s.id === d.sessionId); if (!session) return;
  const newOrders = [...(session.orders || [])]; newOrders.splice(index, 1);
  session.orders = newOrders; d.currentOrders = newOrders;
  renderPsDevices();
  const sRef = docRef("psSessions", d.sessionId);
  setDoc(sRef, { orders: newOrders, updatedAt: Date.now() }, { merge: true }).catch(e => console.warn(e));
};

async function finalizePsSession(device,reason="manual", shouldPrint = true){
 if(!currentUser||!device||psEndingDevices.has(device.id))return;
 psEndingDevices.add(device.id);
 try{
  const now=Date.now(),sessionId=device.sessionId||("legacy_"+device.id+"_"+(device.startedAt||now));
  const sRef=docRef("psSessions",sessionId),dRef=docRef("devices",device.id),tRef=doc(col("psTreasury"));
  const startedAt=Number(device.startedAt)||now; const elapsedMs=Math.max(0,now-startedAt);
  const elapsedMinutes=Math.max(1,Math.ceil(elapsedMs/60000));
  const rate=Number(device.hourlyRate)||PS_DEFAULT_HOURLY_RATE;
  let playTotal=0;
  if(device.sessionMode==="amount"){ const minimumAmount=rate*PS_MIN_SESSION_MINUTES/60; playTotal=Math.max(minimumAmount,Number(device.sessionAmount||0)); }
  else if(device.sessionMode==="auto"){ const halfHourBlocks=Math.max(1,Math.ceil(elapsedMs/(PS_MIN_SESSION_MINUTES*60000))); const chargedMinutes=halfHourBlocks*PS_MIN_SESSION_MINUTES; playTotal=Number((chargedMinutes/60*rate).toFixed(2)); }
  else{ const chargedMinutes=Math.max(PS_MIN_SESSION_MINUTES,elapsedMinutes); playTotal=Number((chargedMinutes/60*rate).toFixed(2)); }
  const orders = device.currentOrders || psSessions.find(s=>s.id===sessionId)?.orders || [];
  const ordersTotal=Number(orders.reduce((sum,o)=>sum+Number(o.lineTotal??(Number(o.price||0)*Number(o.qty||0))),0).toFixed(2));
  let discount = 0; if (reason === "manual") { const discountInput = $("psConfirmDiscountInput"); if (discountInput) discount = Math.max(0, Number(discountInput.value) || 0); }
  const totalBeforeDiscount = playTotal + ordersTotal;
  const total = Math.max(0, Number((totalBeforeDiscount - discount).toFixed(2))); 
  const invoiceNumber="PS-"+now.toString().slice(-8);
  const invoice={invoiceNumber, deviceId:device.id, deviceName:device.name, deviceType:device.deviceType||"room", startedAt, endedAt:now, elapsedMinutes, hourlyRate:rate, sessionMode:device.sessionMode||"duration", plannedMinutes:Number(device.lastDuration||0), plannedAmount:Number(device.sessionAmount||0), playTotal, orders, ordersTotal, discount: discount, total: total, totalBeforeDiscount: totalBeforeDiscount, paymentMethod:"cash", paymentStatus:"paid", finalized:true, reason, date:new Date(now).toLocaleString("ar-EG"), createdAt:now, customerName: device.customerName || ""};
  const typeLabel=invoice.deviceType==="vip"?"صالة VIP":(invoice.deviceType==="base_arabi"?"القاعدة العربي":"روم");
  setDoc(sRef, invoice).catch(err => console.warn(err));
  setDoc(tRef, {type:"in", amount:total, note:`فاتورة ${typeLabel} - ${invoiceNumber}`, deviceName:device.name, deviceType:invoice.deviceType, sessionId, invoiceNumber, date:new Date(now).toLocaleString("ar-EG"), createdAt:now}).catch(err => console.warn(err));
  updateDoc(dRef, {status:"idle", endAt:null, startedAt:null, sessionId:null, sessionMode:null, sessionAmount:null, customerName:null, endedAt:now, lastSessionId:sessionId, lastSessionTotal:total}).catch(err => console.warn(err));
  device.status = "idle"; device.sessionId = null; device.startedAt = null; device.endAt = null; device.sessionMode = null; device.sessionAmount = null; device.customerName = null;
  psAlertedDevices.delete(device.id);
  
  const existingIndex = psSessions.findIndex(s => s.id === sessionId);
  if (existingIndex >= 0) { psSessions[existingIndex] = { id: sessionId, ...invoice }; } else { psSessions.push({ id: sessionId, ...invoice }); }
  renderPsDevices();renderPsStats();renderPsSessions(); if(shouldPrint) printPsInvoice(sessionId);
 }catch(e){ console.error(e); showAlert("تعذر تسجيل الفاتورة: "+e.message, "error"); }
 finally{psEndingDevices.delete(device.id);}
}

function formatPsTime(ms){ const total=Math.max(0,Math.floor(ms/1000)),h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=total%60; return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":"); }

function findReservationForDevice(deviceId) {
  const now = Date.now();
  // نافذة ±30 دقيقة من الآن
  const windowMs = 30 * 60 * 1000;
  return psReservations.find(r => 
    r.status === "pending" && 
    r.deviceId === deviceId && 
    Math.abs(Number(r.time) - now) <= windowMs
  );
}

function buildPsDeviceCard(d){
 const running=d.status==="running",dType=window.getDeviceType(d);
 const isVip=dType==="vip",isBase=dType==="base_arabi";
 const autoMode=running&&d.sessionMode==="auto";
 const time=running?(autoMode?formatPsTime(Date.now()-Number(d.startedAt)):formatPsTime(Number(d.endAt)-Date.now())):"00:00:00";
 const orders=d.currentOrders||psSessions.find(s=>s.id===d.sessionId)?.orders||[];
 const orderTotal=orders.reduce((a,o)=>a+Number(o.lineTotal??(Number(o.price||0)*Number(o.qty||0))),0);
 const itemOptions=psItems.map(i=>`<option value="${i.id}">${escapeHTML(i.name)} - ${money(i.price)} ج</option>`).join("");
 const icon=isVip?"⭐":(isBase?"🏛":"🎮");
 const typeLabel=isVip?"جهاز صالة VIP":(isBase?"جهاز القاعدة العربي":"جهاز روم");
 
 // حجز قادم لهذا الجهاز؟
 const reservation = !running ? findReservationForDevice(d.id) : null;
 const resClass = reservation ? "reserved" : "";
 const resTimeStr = reservation ? new Date(reservation.time).toLocaleTimeString("ar-EG",{hour:'2-digit',minute:'2-digit'}) : "";
 
 // تنبيه قبل الانتهاء 5 دقايق
 let expiringClass = "";
 if (running && !autoMode) {
   const remaining = Number(d.endAt) - Date.now();
   if (remaining > 0 && remaining <= 5*60*1000) expiringClass = "expiring";
 }
 
 const rateInputHtml = `<div class="inline-form"><input id="psRate_${d.id}" type="number" min=".01" step=".01" value="${Number(d.hourlyRate)||PS_DEFAULT_HOURLY_RATE}"><button class="secondary" onclick="updatePsRate('${d.id}')">حفظ السعر</button></div>`;
 const deleteBtnHtml = `<button class="red" onclick="deletePsDevice('${d.id}')">حذف الجهاز</button>`;

 return `<div class="ps-device-card ${running?"running":""} ${resClass} ${expiringClass}">
  <div class="top"><h3>${icon} ${escapeHTML(d.name)}</h3><span class="tag ${running?"good":reservation?"res":""}">${running?"يعمل الآن":(reservation?"محجوز":"جاهز")}</span></div>
  ${reservation ? `<div class="res-alert">📅 محجوز للعميل: <b>${escapeHTML(reservation.customerName)}</b> الساعة ${resTimeStr}</div>` : ''}
  ${running && d.customerName ? `<p style="text-align:center; font-weight:bold; color:#b72f3b;">👤 العميل: ${escapeHTML(d.customerName)}</p>` : ''}
  <div class="ps-device-time ${running?"":"ps-device-idle"}" id="psClock_${d.id}">${time}</div>
  <p class="muted" style="text-align:center" id="psClockLabel_${d.id}">${running?(autoMode?"الوقت المنقضي - حساب تلقائي":"الوقت المتبقي"):"الجهاز جاهز لجلسة جديدة"}</p>
  <label>سعر الساعة بالجنيه</label>
  ${rateInputHtml}
  ${running?`
   <div class="card" style="padding:10px;margin:10px 0">
    <b>إضافة طلبات إلى فاتورة ${isVip?"VIP":(isBase?"القاعدة العربي":"الروم")}</b>
    <label>المشروب أو السندوتش</label>
    <select id="orderItem_${d.id}">${itemOptions||'<option value="">لا توجد أصناف</option>'}</select>
    <label>الكمية</label><input id="orderQty_${d.id}" type="number" min="1" value="1">
    <button class="green big" onclick="addOrderToRoom('${d.id}')">+ إضافة إلى الفاتورة</button>
    <div class="order-list"><b>طلبات الجهاز الحالية</b>
     ${orders.map((o,index)=>`<div class="order-line"><span>${escapeHTML(o.name)} × ${o.qty}<br>${money(o.price)} ج</span><b>${money(o.lineTotal??(o.price*o.qty))} ج</b><button class="rowbtn red" onclick="removeRoomOrder('${d.id}',${index})">حذف</button></div>`).join("")||'<p class="muted">لا توجد طلبات إضافية.</p>'}
     <p><b>إجمالي الإضافات: ${money(orderTotal)} جنيه</b></p>
    </div>
   </div>
   ${autoMode?'<div class="mode-note">حساب تلقائي: كل نصف ساعة أو جزء منها يُحسب نصف ساعة.</div>':`
    <div class="ps-device-actions">
     <select id="psExtend_${d.id}"><option value="30">تمديد نصف ساعة</option><option value="60">ساعة</option><option value="90">ساعة ونصف</option><option value="120">ساعتان</option><option value="180">3 ساعات</option></select>
     <button class="green" onclick="extendPsDevice('${d.id}')">تمديد الوقت</button>
    </div>
   `}
   <button class="red big" onclick="stopPsDevice('${d.id}')">إنهاء الجلسة والفاتورة</button>
  `:`
   ${reservation ? `<button class="big green" onclick="startFromReservation('${reservation.id}','${d.id}')">▶ بدء الجلسة للحجز</button>` : ''}
   <label>اسم العميل (اختياري)</label>
   <input id="psCustomerName_${d.id}" placeholder="اتركه فارغاً إذا لم يكن هناك عميل" value="${reservation?escapeHTML(reservation.customerName):''}">
   <label>طريقة حساب الجلسة</label>
   <select id="psMode_${d.id}" onchange="togglePsMode('${d.id}')">
    <option value="duration">⏱ تحديد مدة الجلسة</option>
    <option value="auto">♾ حساب تلقائي حسب الوقت</option>
    <option value="amount">💵 تحديد مبلغ وحساب المدة</option>
   </select>
   <div id="psDurationBox_${d.id}">
    <label>اختر مدة اللعب</label>
    <select id="psDuration_${d.id}">
     <option value="30">نصف ساعة</option><option value="60">ساعة واحدة</option><option value="90">ساعة ونصف</option><option value="120">ساعتان</option><option value="180">3 ساعات</option><option value="240">4 ساعات</option>
    </select>
   </div>
   <div id="psAutoBox_${d.id}" class="hidden"><div class="mode-note">سيبدأ العداد من لحظة التشغيل.</div></div>
   <div id="psAmountBox_${d.id}" class="hidden">
    <label>مبلغ الجلسة بالجنيه</label>
    <input id="psAmount_${d.id}" type="number" min="${(Number(d.hourlyRate)||PS_DEFAULT_HOURLY_RATE)/2}" step=".01" placeholder="اكتب المبلغ">
   </div>
   <div class="ps-device-actions"><button class="green" onclick="startPsDevice('${d.id}')">▶ بدء الجلسة</button>${deleteBtnHtml}</div>
  `}
 </div>`;
}

function renderPsDevices(){
 const rooms=psDevices.filter(d=>window.getDeviceType(d)==="room");
 const vips=psDevices.filter(d=>window.getDeviceType(d)==="vip");
 const bases=psDevices.filter(d=>window.getDeviceType(d)==="base_arabi");
 $("psDevicesList").innerHTML=rooms.map(buildPsDeviceCard).join("")||'<div class="ps-empty">لا توجد رومات.</div>';
 $("psVipDevicesList").innerHTML=vips.map(buildPsDeviceCard).join("")||'<div class="ps-empty">لا توجد أجهزة VIP.</div>';
 $("psBaseArabiDevicesList").innerHTML=bases.map(buildPsDeviceCard).join("")||'<div class="ps-empty">لا توجد أجهزة في القاعدة.</div>';
}
window.togglePsMode=id=>{
 const mode=$(`psMode_${id}`).value;
 $(`psAmountBox_${id}`).classList.toggle("hidden",mode!=="amount");
 $(`psDurationBox_${id}`).classList.toggle("hidden",mode!=="duration");
 $(`psAutoBox_${id}`).classList.toggle("hidden",mode!=="auto");
};

function startPsTimer(){
 if(psTimer)clearInterval(psTimer);
 psTimer=setInterval(async()=>{
  const now=Date.now();
  for(const d of psDevices){
   if(d.status!=="running")continue;
   const clock=$(`psClock_${d.id}`);
   if(d.sessionMode==="auto"){ if(clock)clock.textContent=formatPsTime(now-Number(d.startedAt||now)); }
   else{ 
       const remaining=Number(d.endAt)-now; 
       // تنبيه قبل 5 دقايق
       if (remaining > 0 && remaining <= 5*60*1000 && !psAlertedDevices.has(d.id)) {
         psAlertedDevices.add(d.id);
         playAlertSound();
         const card = document.querySelector(`#psClock_${d.id}`)?.closest('.ps-device-card');
         if (card) card.classList.add('expiring');

         }
       }
       if(remaining<=0){ 
           if(clock)clock.textContent="00:00:00"; 
           if(!psEndingDevices.has(d.id))await finalizePsSession(d,"automatic"); 
       }else if(clock)clock.textContent=formatPsTime(remaining); 
   }
  }
  renderPsStats();
 },1000);

 });

// ===== renderStats (كانت ناقصة) =====
function renderStats(){
  if (!$("statProducts")) return;
  $("statProducts").textContent = products.length;
  $("statSales").textContent = sales.length;
  const today = new Date().toISOString().slice(0,10);
  const todayRevenue = sales.filter(s => {
    try {
      const d = new Date(s.date);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` === today;
    } catch(e){ return false; }
  }).reduce((sum, s) => sum + Number(s.total || 0), 0);
  if ($("statRevenue")) $("statRevenue").textContent = money(todayRevenue) + " جنيه";
  let tIn = 0, tOut = 0;
  treasury.forEach(t => { if (t.type === "in") tIn += Number(t.amount||0); else tOut += Number(t.amount||0); });
  if ($("statTreasuryBalance")) $("statTreasuryBalance").textContent = money(tIn - tOut) + " جنيه";
  if ($("reportRevenue")) {
    const totalRevenue = sales.reduce((s,x)=>s+Number(x.total||0),0);
    const totalExpenses = expenses.reduce((s,x)=>s+Number(x.amount||0),0);
    $("reportRevenue").textContent = money(totalRevenue) + " جنيه";
    $("reportExpenses").textContent = money(totalExpenses) + " جنيه";
    $("reportNet").textContent = money(totalRevenue - totalExpenses) + " جنيه";
  }
  if ($("treasuryBalanceDisplay")) $("treasuryBalanceDisplay").textContent = money(tIn - tOut) + " جنيه";
}

window.handleBarcodeScan = (event) => {
  if (event.key === 'Enter') {
    event.preventDefault();
    const code = event.target.value.trim();
    if (!code) return;
    const product = products.find(p => p.barcode === code);
    if (product) {
      if (Number(product.qty) > 0) {
        selectedProduct = product;
        $("saleSearch").value = product.name;
        $("salePrice").value = product.price;
        addToCart();
        event.target.value = ""; 
      } else {
        showAlert("هذا المنتج غير متوفر في المخزون حالياً.", "warning");
        event.target.value = "";
      }
    } else {
      showAlert("الباركود غير مسجل في النظام.", "error");
      event.target.value = "";
    }
  }
};

 if(qty<=0)return showAlert("أدخل كمية صحيحة.", "warning");
 if(price<0||!Number.isFinite(price))return showAlert("أدخل سعر بيع صحيح.", "warning");
 const old=cart.find(x=>x.productId===p.id),already=old?old.qty:0;
 if(qty+already>Number(p.qty))return showAlert("الكمية المطلوبة أكبر من المخزون.", "warning");
 if(old){old.qty+=qty;old.price=price;}else cart.push({productId:p.id,name:p.name,qty,price,cost:p.cost||0});
 selectedProduct=null;$("saleSearch").value="";$("saleQty").value="1";$("salePrice").value="";$("searchResults").innerHTML="";renderCart();$("saleSearch").focus();
};
function renderCart(){
 $("cartTable").innerHTML=cart.map((x,i)=>`<tr><td>${escapeHTML(x.name)}</td><td>${x.qty}</td><td>${money(x.price)} ج</td><td><b>${money(x.qty*x.price)} ج</b></td><td><button class="rowbtn red" onclick="removeCartItem(${i})">حذف</button></td></tr>`).join("")||'<tr><td colspan="5" style="text-align:center">الفاتورة فارغة</td></tr>';
 const subtotal=cart.reduce((s,x)=>s+x.qty*x.price,0),discount=Math.max(0,Number($("saleDiscount").value)||0),addition=Math.max(0,Number($("saleAddition").value)||0),total=Math.max(0,subtotal-discount+addition);
 $("cartTotalDisplay").textContent=money(total);return {subtotal,discount,addition,total};
}
window.renderCart=renderCart;
$("saleDiscount").addEventListener("input",renderCart);$("saleAddition").addEventListener("input",renderCart);
window.removeCartItem=i=>{cart.splice(i,1);renderCart();};
window.clearCart=()=>{ if(cart.length&&!confirm("هل تريد إلغاء الفاتورة؟"))return; cart=[];$("saleDiscount").value="0";$("saleAddition").value="0";$("saleSearch").value="";$("saleQty").value="1";$("salePrice").value="";$("searchResults").innerHTML="";selectedProduct=null;renderCart(); };

window.completeSale=async()=>{
 if(!cart.length)return showAlert("الفاتورة فارغة.", "warning");
 const {subtotal,discount,addition,total}=renderCart();
 if(discount>subtotal+addition)return showAlert("الخصم أكبر من الإجمالي.", "warning");
 for(const item of cart){const p=products.find(x=>x.id===item.productId);if(!p||Number(p.qty)<item.qty)return showAlert("المخزون غير كافٍ: "+item.name, "error");}
 const invoice={number:"INV-"+Date.now().toString().slice(-6),subtotal,discount,addition,total,items:[...cart],date:new Date().toLocaleString("ar-EG")};
 try{
  for(const item of cart){const p=products.find(x=>x.id===item.productId);await updateDoc(docRef("products",item.productId),{qty:Number(p.qty)-Number(item.qty)});}
  await setDoc(doc(col("sales")), invoice);
  await setDoc(doc(col("treasury")), {type:"in",amount:total,note:`فاتورة مبيعات #${invoice.number}`,date:invoice.date});
  if($("autoPrintToggle").checked)printInvoiceDirectly(invoice);
  cart=[];$("saleDiscount").value="0";$("saleAddition").value="0";$("saleSearch").value="";$("saleQty").value="1";$("salePrice").value="";selectedProduct=null;renderCart();
  loadBusiness().catch(e=>console.warn(e));
  showAlert("تم البيع بنجاح. الإجمالي: "+money(total)+" جنيه", "success");
 }catch(e){showAlert("حدث خطأ أثناء البيع: "+e.message, "error");}
};
window.printInvoiceDirectly=inv=>{
 $("printArea").innerHTML=`<div style="text-align:center;font-family:Arial;padding:10px"><h2>${escapeHTML(profile?.shopName||"متجري")}</h2><h3>فاتورة مبيعات</h3><p>رقم الفاتورة: ${inv.number}</p><p>التاريخ: ${inv.date}</p><hr><table style="width:100%;min-width:0"><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${inv.items.map(i=>`<tr><td>${escapeHTML(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join("")}</table><hr><p>إجمالي الأصناف: ${money(inv.subtotal)} جنيه</p><p>الخصم: -${money(inv.discount)} جنيه</p><p>الإضافة: +${money(inv.addition)} جنيه</p><h2>الإجمالي النهائي: ${money(inv.total)} جنيه</h2><p>شكراً لتعاملكم معنا</p><p>تطوير: محمد الصلاحي</p></div>`;
 window.print();
};
window.addTreasuryTransaction=async()=>{
 const type=$("tType").value,amount=Number($("tAmount").value)||0,note=$("tNote").value.trim();
 if(amount<=0)return showAlert("أدخل مبلغاً صحيحاً.", "warning");
 await setDoc(doc(col("treasury")), {type, amount, note:note||"حركة يدوية", date:new Date().toLocaleString("ar-EG")});
 $("tAmount").value="";$("tNote").value="";await loadTreasury();renderStats();showAlert("تم تسجيل الحركة.", "success");
};
function renderTreasury(){
 let tIn=0,tOut=0;
 $("treasuryTable").innerHTML=treasury.map(t=>{
  if(t.type==="in")tIn+=Number(t.amount)||0;else tOut+=Number(t.amount)||0;
  return `<tr><td><span class="tag ${t.type==="in"?"good":""}">${t.type==="in"?"وارد":"صادر"}</span></td><td>${money(t.amount)} ج</td><td>${escapeHTML(t.note||"")}</td><td>${t.date||""}</td></tr>`;
 }).join("")||"<tr><td colspan='4'>لا توجد حركات</td></tr>";
 if ($("treasuryBalanceDisplay")) $("treasuryBalanceDisplay").textContent=money(tIn-tOut)+" جنيه";
}

window.addExpense=async()=>{
 const name=$("expenseName").value.trim(),amount=Number($("expenseAmount").value)||0;
 if(!name||amount<=0)return showAlert("أدخل اسم المصروف والمبلغ.", "warning");
 const date=new Date().toLocaleString("ar-EG");
 await setDoc(doc(col("expenses")), {name, amount, date});
 await setDoc(doc(col("treasury")), {type:"out", amount, note:"مصروف: "+name, date});
 $("expenseName").value="";$("expenseAmount").value="";await loadBusiness();showAlert("تم حفظ المصروف.", "success");
};
function renderExpenses(){ $("expensesTable").innerHTML=expenses.map(e=>`<tr><td>${escapeHTML(e.name)}</td><td>${money(e.amount)} ج</td><td>${e.date}</td></tr>`).join("")||"<tr><td colspan='3'>لا توجد مصروفات</td></tr>"; }

function getFilteredSales() {
  const q = ($("salesSearchInput")?.value || "").trim().toLowerCase();
  const from = $("salesDateFrom")?.value;
  const to = $("salesDateTo")?.value;
  return sales.filter(s => {
    if (q && !String(s.number||"").toLowerCase().includes(q)) return false;
    if (from || to) {
      try {
        const d = new Date(s.date); const sDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        if (from && sDate < from) return false;
        if (to && sDate > to) return false;
      } catch(e) { return false; }
    }
    return true;
  });
}

function renderSales(){
  const filtered = getFilteredSales();
  $("salesTable").innerHTML=filtered.map(s=>`<tr><td>${escapeHTML(s.number||"")}</td><td>${s.date||""}</td><td>${money(s.total)} ج</td><td><button class="rowbtn secondary" onclick="printSavedInvoice('${s.id}')">طباعة</button></td></tr>`).join("")||"<tr><td colspan='4'>لا توجد فواتير</td></tr>";
}
window.printSavedInvoice=id=>{const inv=sales.find(s=>s.id===id);if(inv)printInvoiceDirectly(inv);};

window.printShiftReport = () => {
  const today = new Date().toISOString().slice(0,10);
  const todaySales = sales.filter(s => { try { const d = new Date(s.date); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` === today; } catch(e){ return false; } });
  const totalRevenue = todaySales.reduce((s,x)=>s+Number(x.total||0),0);
  const todayExpenses = expenses.filter(e => { try { const d = new Date(e.date); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` === today; } catch(e){ return false; } });
  const totalExpenses = todayExpenses.reduce((s,x)=>s+Number(x.amount||0),0);
  const net = totalRevenue - totalExpenses;
  $("printArea").innerHTML = `
  <div style="font-family:Arial;padding:15px;direction:rtl;max-width:600px;margin:auto;">
    <h2 style="text-align:center;">${escapeHTML(profile?.shopName || "متجري")}</h2>
    <h3 style="text-align:center;">تقرير الوردية / اليوم</h3>
    <p style="text-align:center;">التاريخ: ${new Date().toLocaleString("ar-EG")}</p>
    <hr>
    <div><b>عدد الفواتير:</b> ${todaySales.length}</div>
    <div><b>إجمالي المبيعات:</b> ${money(totalRevenue)} جنيه</div>
    <div><b>إجمالي المصروفات:</b> ${money(totalExpenses)} جنيه</div>
    <hr>
    <h2 style="text-align:center;color:${net>=0?'#178653':'#b72f3b'};">صافي اليوم: ${money(net)} جنيه</h2>
    <hr>
    <p style="text-align:center;font-size:12px;color:#888;">تطوير: محمد الصلاحي</p>
  </div>`;
  window.print();
};

window.addReservation = async () => {
  const deviceId = $("resDeviceId").value;
  const customerName = $("resCustomerName").value.trim();
  const phone = $("resCustomerPhone").value.trim();
  const dateVal = $("resDate").value;
  const timeVal = $("resTime").value;
  if (!deviceId || !customerName || !timeVal) return showAlert("اختر الجهاز، اكتب اسم العميل والوقت.", "warning");
  
  const d = psDevices.find(x=>x.id===deviceId);
  const useDate = dateVal || new Date().toISOString().slice(0,10);
  const [hours, minutes] = timeVal.split(':');
  const [y, m, day] = useDate.split('-').map(Number);
  const resDate = new Date(y, m-1, day, Number(hours), Number(minutes));

  try {
    await setDoc(doc(col("psReservations")), {
      deviceId, deviceName: d ? d.name : "جهاز",
      customerName, phone, time: resDate.getTime(),
      status: "pending", createdAt: Date.now()
    });
    $("resCustomerName").value = ""; $("resCustomerPhone").value = ""; $("resTime").value = ""; $("resDate").value = "";
    await loadPlaystationData();
    renderPsReservations();
    renderPsStats();
    showAlert("تم إضافة الحجز بنجاح.", "success");
  } catch(e) { showAlert(e.message, "error"); }
};

function renderPsReservations() {
  const sel = $("resDeviceId");
  if(sel) {
      const rooms = psDevices.filter(d => window.getDeviceType(d) === "room");
      const vips = psDevices.filter(d => window.getDeviceType(d) === "vip");
      const bases = psDevices.filter(d => window.getDeviceType(d) === "base_arabi");
      
      let optionsHtml = "";
      if(rooms.length) optionsHtml += `<optgroup label="🎮 أجهزة الرومات">${rooms.map(d=>`<option value="${d.id}">${escapeHTML(d.name)}</option>`).join("")}</optgroup>`;
      if(vips.length) optionsHtml += `<optgroup label="⭐ أجهزة صالة VIP">${vips.map(d=>`<option value="${d.id}">${escapeHTML(d.name)}</option>`).join("")}</optgroup>`;
      if(bases.length) optionsHtml += `<optgroup label="🏛 أجهزة القاعدة العربي">${bases.map(d=>`<option value="${d.id}">${escapeHTML(d.name)}</option>`).join("")}</optgroup>`;
      
      sel.innerHTML = optionsHtml || `<option value="">لا توجد أجهزة مضافة</option>`;
  }
  
  const tbody = $("psReservationsTable");
  if(!tbody) return;
  
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  let filtered = psReservations.filter(r => r.status === "pending" && Number(r.time) >= todayStart.getTime());
  filtered.sort((a,b) => a.time - b.time);

  tbody.innerHTML = filtered.map(r => {
    const dt = new Date(r.time);
    const dateStr = dt.toLocaleDateString("ar-EG");
    const timeStr = dt.toLocaleTimeString("ar-EG", {hour: '2-digit', minute:'2-digit'});
    const isToday = dt.toDateString() === new Date().toDateString();
    return `<tr>
      <td>${escapeHTML(r.customerName)}</td>
      <td>${escapeHTML(r.phone||"—")}</td>
      <td>${escapeHTML(r.deviceName)}</td>
      <td>${dateStr}</td>
      <td><span class="tag" style="background:${isToday?'#e0f2fe':'#fef3c7'};color:${isToday?'#0369a1':'#92400e'}">${timeStr}</span></td>
      <td>${isToday?'اليوم':'قادم'}</td>
      <td>
        <button class="rowbtn green" onclick="startFromReservation('${r.id}', '${r.deviceId}')">بدء الجلسة</button>
        <button class="rowbtn red" onclick="deleteReservation('${r.id}')">إلغاء</button>
      </td>
    </tr>`;
  }).join("") || '<tr><td colspan="7">لا توجد حجوزات قادمة.</td></tr>';
}

window.startFromReservation = async (resId, deviceId) => {
  const d = psDevices.find(x=>x.id===deviceId);
  if(!d) return showAlert("الجهاز غير موجود.", "error");
  if(d.status === "running") return showAlert("هذا الجهاز يعمل بالفعل الآن.", "warning");
  
  const r = psReservations.find(x=>x.id===resId);
  if(r) {
      showPsSection('devices');
      setTimeout(() => {
          const nameInput = $(`psCustomerName_${deviceId}`);
          if(nameInput) {
              nameInput.value = r.customerName;
              nameInput.scrollIntoView({behavior: 'smooth', block: 'center'});
          }
          deleteDoc(docRef("psReservations", resId)).then(()=>{ loadPlaystationData(); renderPsStats(); });
      }, 300);
  }
};

window.deleteReservation = async (id) => {
  if(!confirm("هل تريد إلغاء هذا الحجز؟")) return;
  try { await deleteDoc(docRef("psReservations", id)); await loadPlaystationData(); renderPsReservations(); renderPsStats(); showAlert("تم إلغاء الحجز", "success"); } 
  catch(e) { showAlert(e.message, "error"); }
};

function renderPsCustomers() {
  const tbody = $("psCustomersTable");
  if(!tbody) return;

  const customers = {};
  psSessions.filter(s => s.finalized || s.endedAt).forEach(s => {
      const name = (s.customerName || "").trim();
      if (!name) return;
      
      if (!customers[name]) {
          customers[name] = { count: 0, total: 0, lastVisit: 0 };
      }
      customers[name].count++;
      customers[name].total += Number(s.total || 0);
      customers[name].lastVisit = Math.max(customers[name].lastVisit, s.endedAt || 0);
  });

  const sorted = Object.keys(customers).map(name => ({ name, ...customers[name] })).sort((a,b) => b.count - a.count);

  tbody.innerHTML = sorted.map((c, index) => {
      const lastVisitStr = c.lastVisit ? new Date(c.lastVisit).toLocaleDateString("ar-EG") : "—";
      return `<tr>
          <td><b>${index === 0 ? '🥇 1' : index === 1 ? '🥈 2' : index === 2 ? '🥉 3' : index+1}</b></td>
          <td>${escapeHTML(c.name)}</td>
          <td><span class="tag good">${c.count} زيارة</span></td>
          <td>${money(c.total)} ج</td>
          <td>${lastVisitStr}</td>
      </tr>`;
  }).join("") || '<tr><td colspan="5">لا توجد بيانات عملاء حتى الآن. اكتب اسم العميل عند بدء الجلسة ليتم تسجيله.</td></tr>';
}

function renderPsReports() {
  const allSessions = psSessions.filter(s => s.finalized || s.endedAt);
  
  let totalRev = 0;
  let roomRev = 0, vipRev = 0, baseRev = 0, drinksRev = 0, sandRev = 0;

  allSessions.forEach(s => {
      totalRev += Number(s.total || 0);
      
      if (s.deviceType === "vip") vipRev += Number(s.playTotal || 0);
      else if (s.deviceType === "base_arabi") baseRev += Number(s.playTotal || 0);
      else roomRev += Number(s.playTotal || 0);
      
      if (Array.isArray(s.orders)) {
          s.orders.forEach(o => {
              if (o.category === "drink") drinksRev += Number(o.lineTotal || 0);
              if (o.category === "sandwich") sandRev += Number(o.lineTotal || 0);
          });
      }
  });

  $("psTotalRevenueAll").textContent = money(totalRev) + " جنيه";
  $("psTotalSessionsAll").textContent = allSessions.length;

  const revData = [];
  const dateLabels = [];
  for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().slice(0, 10);
      const daySessions = allSessions.filter(s => new Date(s.endedAt || s.createdAt).toISOString().slice(0, 10) === dateStr);
      const dayTotal = daySessions.reduce((sum, s) => sum + Number(s.total || 0), 0);
      revData.push(dayTotal);
      dateLabels.push(d.toLocaleDateString("ar-EG", { weekday: 'short', day: 'numeric' }));
  }

  if (revenueChartInstance) revenueChartInstance.destroy();
  const ctx1 = document.getElementById('revenueChart');
  if (ctx1) {
      revenueChartInstance = new Chart(ctx1, {
          type: 'bar',
          data: {
              labels: dateLabels,
              datasets: [{
                  label: 'الإيرادات (جنيه)',
                  data: revData,
                  backgroundColor: '#2458d3',
                  borderRadius: 6
              }]
          },
          options: {
              responsive: true,
              plugins: { legend: { display: false } },
              scales: { y: { beginAtZero: true } }
          }
      });
  }

  if (typeChartInstance) typeChartInstance.destroy();
  const ctx2 = document.getElementById('typeChart');
  if (ctx2) {
      typeChartInstance = new Chart(ctx2, {
          type: 'doughnut',
          data: {
              labels: ['رومات', 'VIP', 'قاعدة عربي', 'مشروبات', 'سندوتشات'],
              datasets: [{
                  data: [roomRev, vipRev, baseRev, drinksRev, sandRev],
                  backgroundColor: ['#178653', '#7c3aed', '#d97706', '#0ea5e9', '#b72f3b'],
                  borderWidth: 0
              }]
          },
          options: {
              responsive: true,
              plugins: { legend: { position: 'bottom' } }
          }
      });
  }
}
</script>
