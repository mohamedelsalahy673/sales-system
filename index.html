<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق النظام - متجاوب وآمن</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header / Navigation -->
    <header class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">واجهة النظام المعالجة</h1>
        <div class="flex items-center space-x-2 space-x-reverse">
            <span id="status-indicator" class="inline-block w-3 h-3 bg-emerald-400 rounded-full"></span>
            <span id="status-text" class="text-sm">النظام يعمل بشكل مستقر</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-6 flex flex-col gap-6">
        
        <!-- Controls Card -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">لوحة التحكّم والعمليات</h2>
            
            <div class="flex flex-wrap gap-4">
                <button id="btn-fetch" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition duration-200 shadow-sm active:scale-95">
                    تحديث البيانات (Fetch)
                </button>

                <button id="btn-reset" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-lg transition duration-200">
                    إعادة ضبط الواجهة
                </button>
            </div>
        </section>

        <!-- Data Display Table/Container -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex-1 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-700">سجل العرض</h2>
                <span id="data-count" class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-medium">0 عنصر</span>
            </div>

            <!-- Loader -->
            <div id="loader" class="hidden my-8 text-center text-indigo-600">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
                <p class="mt-2 text-sm text-slate-500">جاري تحميل البيانات الأحدث بدون تجميد...</p>
            </div>

            <!-- Data List Container -->
            <div id="data-container" class="space-y-3 overflow-y-auto max-h-96 pr-1">
                <div class="p-8 text-center text-slate-400 text-sm">
                    لا توجد بيانات معروضة حالياً. اضغط على "تحديث البيانات" للتحميل.
                </div>
            </div>
        </section>

    </main>

    <!-- Application Script with Anti-Freeze Guards -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnFetch = document.getElementById('btn-fetch');
            const btnReset = document.getElementById('btn-reset');
            const dataContainer = document.getElementById('data-container');
            const dataCount = document.getElementById('data-count');
            const loader = document.getElementById('loader');
            const statusIndicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');

            let isProcessing = false;

            // Safe State Update Handler (Prevents UI Blocking)
            async function fetchDataSafe() {
                if (isProcessing) return; // Prevent multiple clicks/loops
                isProcessing = true;

                // UI Loading State
                loader.classList.remove('hidden');
                btnFetch.disabled = true;
                btnFetch.classList.add('opacity-50', 'cursor-not-allowed');

                try {
                    // Simulated API Fetch with Abort Controller / Non-blocking timeout
                    const data = await simulateApiCall();

                    // Render Data Non-blocking using RequestAnimationFrame
                    requestAnimationFrame(() => {
                        renderData(data);
                    });

                } catch (error) {
                    console.error('حدث خطأ أثناء تحميل البيانات:', error);
                    statusIndicator.className = "inline-block w-3 h-3 bg-rose-500 rounded-full";
                    statusText.textContent = "حدث خطأ في النظام";
                } finally {
                    loader.classList.add('hidden');
                    btnFetch.disabled = false;
                    btnFetch.classList.remove('opacity-50', 'cursor-not-allowed');
                    isProcessing = false;
                }
            }

            // Mock Data Generation without infinite loops
            function simulateApiCall() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        const items = Array.from({ length: 5 }, (_, index) => ({
                            id: Date.now() + index,
                            title: `عنصر جديد رقم #${index + 1}`,
                            timestamp: new Date().toLocaleTimeString('ar-EG')
                        }));
                        resolve(items);
                    }, 800);
                });
            }

            // Safe Rendering Method
            function renderData(items) {
                if (!items || items.length === 0) return;

                dataContainer.innerHTML = '';
                dataCount.textContent = `${items.length} عناصر`;

                const fragment = document.createDocumentFragment();

                items.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = "p-4 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center hover:bg-indigo-50/50 transition";
                    card.innerHTML = `
                        <div>
                            <p class="font-medium text-slate-800">${item.title}</p>
                            <p class="text-xs text-slate-400">وقت الإضافة: ${item.timestamp}</p>
                        </div>
                        <span class="text-xs px-2 py-1 bg-emerald-100 text-emerald-700 font-medium rounded">نشط</span>
                    `;
                    fragment.appendChild(card);
                });

                dataContainer.appendChild(fragment);
                statusIndicator.className = "inline-block w-3 h-3 bg-emerald-400 rounded-full";
                statusText.textContent = "النظام يعمل بشكل مستقر";
            }

            // Reset Function
            function resetData() {
                dataContainer.innerHTML = `
                    <div class="p-8 text-center text-slate-400 text-sm">
                        تمت إعادة الضبط. اضغط على "تحديث البيانات" للتحميل.
                    </div>
                `;
                dataCount.textContent = '0 عنصر';
            }

            // Event Listeners
            btnFetch.addEventListener('click', fetchDataSafe);
            btnReset.addEventListener('click', resetData);
        });
    </script>
</body>
</html>
