window.loadUsers=async()=>{

  const snap=await getDocs(collection(db,"users")),list=snap.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.role!=="owner");
  $("totalUsers").textContent=list.length;
  const salesList=list.filter(u=>systemInfo(u,"sales").status!=="not_registered");
  const psList=list.filter(u=>systemInfo(u,"playstation").status!=="not_registered");
  $("salesUsersCount").textContent=salesList.length;$("psUsersCount").textContent=psList.length;
  $("pendingUsersCount").textContent=list.reduce((c,u)=>c+(systemInfo(u,"sales").status==="pending"?1:0)+(systemInfo(u,"playstation").status==="pending"?1:0),0);
  const render=(arr,system)=>arr.map(u=>{
   const info=systemInfo(u,system),expiry=info.expiryDate?.toDate?info.expiryDate.toDate():info.expiryDate,expired=expiry&&new Date(expiry)<new Date();
   let statusText="قيد المراجعة",good=false;
   if(info.status==="active"&&!expired){statusText="نشط";good=true;}
   else if(info.status==="active"&&expired)statusText="منتهي";
   else if(info.status==="pending")statusText="طلب جديد";
   return `<tr><td>${escapeHTML(u.shopName||"")}</td><td>${escapeHTML(u.customerName||"")}</td><td>${escapeHTML(u.email||"")}</td><td>${escapeHTML(u.phone||"")}</td><td><span class="tag ${good?"good":""}">${statusText}</span></td><td>${escapeHTML(info.requestedPlan||info.plan||"غير محدد")} ${Number(info.requestedPrice)?`<br>${Number(info.requestedPrice)} جنيه`:""}</td><td>${planControls(u,system)}</td></tr>`;
  }).join("")||'<tr><td colspan="7">لا يوجد عملاء</td></tr>';

  $("psUsersTable").innerHTML=render(psList,"playstation");
 }catch(e){console.error(e);alert("تعذر تحميل العملاء: "+e.message);}
};

async function loadPlaystationData(){
 if(!currentUser)return;
 try{
  const [ds,is,ss]=await Promise.all([getDocs(col("devices")),getDocs(col("psItems")),getDocs(col("psSessions"))]);
  psDevices=ds.docs.map(d=>({id:d.id,...d.data()}));
  psItems=is.docs.map(d=>({id:d.id,...d.data()}));
  psSessions=ss.docs.map(d=>({id:d.id,...d.data()}));

  for(const d of [...psDevices]){
   if(d.status==="running"&&d.sessionMode!=="auto"&&Number(d.endAt)>0&&Number(d.endAt)<=Date.now()){
    await finalizePsSession(d,"automatic");
   }
  }
  const refreshed=await getDocs(col("devices"));
  psDevices=refreshed.docs.map(d=>({id:d.id,...d.data()}));
  const sessions=await getDocs(col("psSessions"));
  psSessions=sessions.docs.map(d=>({id:d.id,...d.data()}));
  renderPsDevices();renderPsItems();renderPsStats();renderPsSessions();
 }catch(e){console.error(e);alert("تعذر تحميل بيانات البلايستيشن: "+e.message);}
}

/* تقريب المدة لأعلى إلى أقرب نصف ساعة، مع حد أدنى 30 دقيقة */
function roundUpToBillingBlock(minutes){
 const value=Math.max(PS_MIN_SESSION_MINUTES,Number(minutes)||0);
 return Math.ceil(value/PS_BILLING_BLOCK_MINUTES)*PS_BILLING_BLOCK_MINUTES;
}
function minimumHalfHourPrice(rate){
 return Number((Number(rate)*PS_MIN_SESSION_MINUTES/60).toFixed(2));
}
function calculateAutoPlayTotal(elapsedMs,rate){
 const elapsedMinutes=Math.max(0,elapsedMs/60000);
 const chargedMinutes=roundUpToBillingBlock(elapsedMinutes);
 return {
  chargedMinutes,
  playTotal:Number((chargedMinutes/60*rate).toFixed(2))
 };
}

/* بدء الجلسة: مدة محددة أو حساب تلقائي أو مبلغ */
window.startPsDevice=async id=>{
 const d=psDevices.find(x=>x.id===id);
 if(!d||d.status==="running")return alert("الجهاز غير متاح.");
 const mode=$(`psMode_${id}`).value,rate=Number(d.hourlyRate)||PS_DEFAULT_HOURLY_RATE;
 let minutes=0,plannedAmount=0,now=Date.now(),endAt=null;

 if(mode==="duration"){
  minutes=Number($(`psDuration_${id}`).value);
  if(!Number.isFinite(minutes)||minutes<PS_MIN_SESSION_MINUTES)return alert("أقل مدة للجلسة نصف ساعة.");
  minutes=roundUpToBillingBlock(minutes);
  endAt=now+minutes*60000;
 }else if(mode==="amount"){
  plannedAmount=Number($(`psAmount_${id}`).value);
  const minAmount=minimumHalfHourPrice(rate);
  if(!Number.isFinite(plannedAmount)||plannedAmount<minAmount){
   return alert(`أقل مبلغ للجلسة هو ${money(minAmount)} جنيه، قيمة نصف ساعة.`);
  }
  minutes=roundUpToBillingBlock(plannedAmount/rate*60);
  endAt=now+minutes*60000;
 }else if(mode==="auto"){
  minutes=0;endAt=null;
 }else return alert("اختر طريقة حساب صحيحة.");

 const sessionRef=doc(col("psSessions")),sessionId=sessionRef.id;
 try{
  await setDoc(sessionRef,{
   deviceId:id,deviceName:d.name,deviceType:getDeviceType(d),
   startedAt:now,endAt,plannedMinutes:minutes,hourlyRate:rate,
   sessionMode:mode,plannedAmount:mode==="amount"?plannedAmount:0,
   orders:[],finalized:false,createdAt:now
  });
  await updateDoc(docRef("devices",id),{
   status:"running",startedAt:now,endAt,lastDuration:minutes,
   hourlyRate:rate,sessionId,sessionMode:mode,
   sessionAmount:mode==="amount"?plannedAmount:0
  });
  Object.assign(d,{status:"running",startedAt:now,endAt,hourlyRate:rate,sessionId,sessionMode:mode,sessionAmount:plannedAmount});
  await loadPlaystationData();
 }catch(e){console.error(e);alert("تعذر بدء الجلسة: "+e.message);}
};

window.extendPsDevice=async id=>{
 const d=psDevices.find(x=>x.id===id);
 if(!d||d.status!=="running")return alert("الجهاز غير مشغل.");
 if(d.sessionMode==="auto")return alert("الجلسة تعمل بالحساب التلقائي، لا تحتاج إلى تمديد. أنهِ الجلسة عند الانتهاء.");
 const minutes=Number($(`psExtend_${id}`).value);
 if(!Number.isFinite(minutes)||minutes<PS_MIN_SESSION_MINUTES)return alert("أقل مدة تمديد نصف ساعة.");
 const validMinutes=roundUpToBillingBlock(minutes);
 const now=Date.now(),newEndAt=Math.max(now,Number(d.endAt)||0)+validMinutes*60000;
 try{
  if(!d.sessionId)throw new Error("لا يوجد رقم جلسة للجهاز.");
  const sRef=docRef("psSessions",d.sessionId);
  await runTransaction(db,async tx=>{
   const ss=await tx.get(sRef);
   if(!ss.exists()||ss.data().finalized)throw new Error("الجلسة غير متاحة للتمديد.");
   const old=ss.data(),addAmount=(validMinutes/60)*Number(old.hourlyRate||d.hourlyRate||PS_DEFAULT_HOURLY_RATE);
   tx.update(sRef,{
    endAt:newEndAt,plannedMinutes:Number(old.plannedMinutes||0)+validMinutes,
    plannedAmount:Number(old.plannedAmount||0)+(old.sessionMode==="amount"?addAmount:0),
    lastExtendedAt:now
   });
  });
  await updateDoc(docRef("devices",id),{endAt:newEndAt,lastExtendedAt:now});
  d.endAt=newEndAt;await loadPlaystationData();alert("تم تمديد وقت الجهاز.");
 }catch(e){alert("تعذر التمديد: "+e.message);}
};

/* إنهاء الجلسة وتسجيل إيراد واحد فقط */
async function finalizePsSession(device,reason="manual"){
 if(!currentUser||!device||psEndingDevices.has(device.id))return;
 psEndingDevices.add(device.id);
 try{
  const now=Date.now(),sessionId=device.sessionId||("legacy_"+device.id+"_"+(device.startedAt||now));
  const sRef=docRef("psSessions",sessionId),dRef=docRef("devices",device.id),tRef=doc(col("psTreasury"));
  await runTransaction(db,async tx=>{
   const [ss,ds]=await Promise.all([tx.get(sRef),tx.get(dRef)]);
   if(!ds.exists())return;
   const current=ds.data();
   if(ss.exists()&&ss.data().finalized){
    tx.update(dRef,{status:"idle",endAt:null,sessionId:null,startedAt:null,sessionMode:null,sessionAmount:null});
    return;
   }

   const s=ss.exists()?ss.data():{};
   const startedAt=Number(s.startedAt||current.startedAt)||now;
   const elapsedMs=Math.max(0,now-startedAt);
   const elapsedMinutes=Math.max(0,elapsedMs/60000);
   const rate=Number(s.hourlyRate||current.hourlyRate)||PS_DEFAULT_HOURLY_RATE;

   let playTotal=0,chargedMinutes=PS_MIN_SESSION_MINUTES;

   if(s.sessionMode==="amount"){
    const minAmount=minimumHalfHourPrice(rate);
    playTotal=Math.max(Number(s.plannedAmount||current.sessionAmount||0),minAmount);
    chargedMinutes=roundUpToBillingBlock(Number(s.plannedMinutes||current.lastDuration||PS_MIN_SESSION_MINUTES));
   }else if(s.sessionMode==="auto"){
    const calculated=calculateAutoPlayTotal(elapsedMs,rate);
    playTotal=calculated.playTotal;
    chargedMinutes=calculated.chargedMinutes;
   }else{
    chargedMinutes=roundUpToBillingBlock(Number(s.plannedMinutes||current.lastDuration||elapsedMinutes));
    playTotal=Number((chargedMinutes/60*rate).toFixed(2));
   }

   const orders=Array.isArray(s.orders)?s.orders:[];
   const ordersTotal=Number(orders.reduce((sum,o)=>sum+Number(o.lineTotal??(Number(o.price||0)*Number(o.qty||0))),0).toFixed(2));
   const total=Number((playTotal+ordersTotal).toFixed(2));
   const invoiceNumber="PS-"+now.toString().slice(-8);

   const invoice={
    invoiceNumber,deviceId:device.id,deviceName:current.name||device.name,
    deviceType:current.deviceType||device.deviceType||"room",
    startedAt,endedAt:now,elapsedMinutes:Math.ceil(elapsedMinutes),
    chargedMinutes,hourlyRate:rate,
    sessionMode:s.sessionMode||"duration",plannedMinutes:Number(s.plannedMinutes||0),
    plannedAmount:Number(s.plannedAmount||0),
    playTotal,orders,ordersTotal,total,paymentMethod:"cash",
    paymentStatus:"paid",finalized:true,reason,
    date:new Date(now).toLocaleString("ar-EG"),createdAt:now
   };

   tx.set(sRef,invoice);
   tx.set(tRef,{
    type:"in",amount:total,
    note:`فاتورة ${invoice.deviceType==="vip"?"صالة VIP":"روم"} - ${invoiceNumber}`,
    deviceName:current.name||device.name,deviceType:invoice.deviceType,
    sessionId,invoiceNumber,date:new Date(now).toLocaleString("ar-EG"),createdAt:now
   });
   tx.update(dRef,{
    status:"idle",endAt:null,startedAt:null,sessionId:null,
    sessionMode:null,sessionAmount:null,endedAt:now,
    lastSessionId:sessionId,lastSessionTotal:total
   });
  });

  const [updated,sessions]=await Promise.all([getDoc(dRef),getDocs(col("psSessions"))]);
  if(updated.exists())Object.assign(device,updated.data());
  psSessions=sessions.docs.map(x=>({id:x.id,...x.data()}));
  renderPsDevices();renderPsStats();renderPsSessions();
 }catch(e){console.error(e);alert("تعذر تسجيل الفاتورة: "+e.message);}
 finally{psEndingDevices.delete(device.id);}
}

function formatPsTime(ms){
 const total=Math.max(0,Math.floor(ms/1000)),h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=total%60;
 return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":");
}

function startPsTimer(){
 if(psTimer)clearInterval(psTimer);
 psTimer=setInterval(async()=>{
  const now=Date.now();
  for(const d of psDevices){
   if(d.status!=="running")continue;
   const clock=$(`psClock_${d.id}`);
   if(d.sessionMode==="auto"){
    if(clock)clock.textContent=formatPsTime(now-Number(d.startedAt||now));
   }else{
    const remaining=Number(d.endAt)-now;
    if(remaining<=0){
     if(clock)clock.textContent="00:00:00";
     if(!psEndingDevices.has(d.id))await finalizePsSession(d,"automatic");
    }else if(clock)clock.textContent=formatPsTime(remaining);
   }
  }
  renderPsStats();
 },1000);
}

  }
 }catch(e){console.error(e);}
}
window.updateShopNameSetting=async()=>{
 const n=$("settingsShopName").value.trim();if(!n)return alert("أدخل اسم المحل.");
 try{
  await updateDoc(doc(db,"users",currentUser.uid),{shopName:n});profile.shopName=n;
  $("shopTitle").textContent=n;$("sahalShopTitle").textContent=n;alert("تم تحديث الاسم.");
 }catch(e){alert(e.message);}
};
window.updateCustomerEmailSetting=async()=>{
 const n=$("settingsEmail").value.trim();if(!n)return alert("أدخل البريد الجديد.");
 try{await updateEmail(auth.currentUser,n);await updateDoc(doc(db,"users",currentUser.uid),{email:n});profile.email=n;alert("تم تحديث البريد.");}
 catch(e){alert(e.message);}
};
window.updateCustomerPassword=async()=>{
 const p=$("newCustomerPassword").value;
 if(!p||p.length<6)return alert("كلمة المرور يجب ألا تقل عن 6 أحرف.");
 try{await updatePassword(auth.currentUser,p);$("newCustomerPassword").value="";alert("تم تحديث كلمة المرور.");}
 catch(e){alert("تعذر تحديث كلمة المرور. قد تحتاج إلى تسجيل الدخول مجدداً.");}
};
async function loadBusiness(){await Promise.all([loadProducts(),loadSales(),loadExpenses(),loadTreasury()]);renderStats();}
async function loadProducts(){const s=await getDocs(col("products"));products=s.docs.map(d=>({id:d.id,...d.data()}));renderProducts();}
async function loadSales(){const s=await getDocs(col("sales"));sales=s.docs.map(d=>({id:d.id,...d.data()}));renderSales();}
async function loadExpenses(){const s=await getDocs(col("expenses"));expenses=s.docs.map(d=>({id:d.id,...d.data()}));renderExpenses();}
async function loadTreasury(){const s=await getDocs(col("treasury"));treasury=s.docs.map(d=>({id:d.id,...d.data()}));renderTreasury();}
window.clearTreasuryData=async()=>{
 if(!confirm("هل تريد مسح حركات الخزينة؟"))return;
 const snap=await getDocs(col("treasury"));
 for(const d of snap.docs)await deleteDoc(docRef("treasury",d.id));
 await loadTreasury();renderStats();alert("تم التصفير.");
};
window.saveProduct=async()=>{
 const name=$("pName").value.trim(),cost=Number($("pCost").value)||0,price=Number($("pPrice").value)||0,qty=Number($("pQty").value)||0;
 if(!name||price<=0)return alert("أدخل اسم المنتج وسعر البيع.");
 await addDoc(col("products"),{name,cost,price,qty,createdAt:serverTimestamp()});
 $("pName").value="";$("pCost").value="";$("pPrice").value="";$("pQty").value=10;
 await loadProducts();renderStats();alert("تم حفظ المنتج.");
};
window.deleteProduct=async id=>{
 if(!confirm("حذف المنتج؟"))return;
 await deleteDoc(docRef("products",id));await loadProducts();renderStats();
};
function renderProducts(){
 $("productsTable").innerHTML=products.map(p=>`<tr><td>${escapeHTML(p.name)}</td><td>${money(p.cost)} ج</td><td>${money(p.price)} ج</td><td>${p.qty}</td><td><button class="rowbtn red" onclick="deleteProduct('${p.id}')">حذف</button></td></tr>`).join("")||"<tr><td colspan='5'>لا توجد منتجات</td></tr>";
}
window.searchProducts=()=>{
 const q=$("saleSearch").value.trim().toLowerCase();selectedProduct=null;
 if(!q){$("searchResults").innerHTML="";return;}
 const matches=products.filter(p=>(p.name||"").toLowerCase().includes(q)&&Number(p.qty)>0).slice(0,10);
 $("searchResults").innerHTML=matches.map(p=>`<button class="result secondary" onclick="selectSaleProduct('${p.id}')">${escapeHTML(p.name)} — ${money(p.price)} ج — المتاح ${p.qty}</button>`).join("")||'<div style="padding:12px">لا توجد نتائج</div>';
};
window.selectSaleProduct=id=>{
 selectedProduct=products.find(p=>p.id===id);if(!selectedProduct)return;
 $("saleSearch").value=selectedProduct.name;$("salePrice").value=selectedProduct.price;$("searchResults").innerHTML="";addToCart();
};
window.addToCart=()=>{
 const qty=Number($("saleQty").value)||1,priceInput=$("salePrice").value;
 const price=priceInput===""?Number(selectedProduct?.price||0):Number(priceInput),p=selectedProduct;
 if(!p)return alert("اختر منتجاً من قائمة البحث.");
 if(qty<=0)return alert("أدخل كمية صحيحة.");
 if(price<0||!Number.isFinite(price))return alert("أدخل سعر بيع صحيح.");
 const old=cart.find(x=>x.productId===p.id),already=old?old.qty:0;
 if(qty+already>Number(p.qty))return alert("الكمية المطلوبة أكبر من المخزون.");
 if(old){old.qty+=qty;old.price=price;}
 else cart.push({productId:p.id,name:p.name,qty,price,cost:p.cost||0});
 selectedProduct=null;$("saleSearch").value="";$("saleQty").value="1";$("salePrice").value="";$("searchResults").innerHTML="";
 renderCart();$("saleSearch").focus();
};
function renderCart(){
 $("cartTable").innerHTML=cart.map((x,i)=>`<tr><td>${escapeHTML(x.name)}</td><td>${x.qty}</td><td>${money(x.price)} ج</td><td><b>${money(x.qty*x.price)} ج</b></td><td><button class="rowbtn red" onclick="removeCartItem(${i})">حذف</button></td></tr>`).join("")||'<tr><td colspan="5" style="text-align:center">الفاتورة فارغة</td></tr>';
 const subtotal=cart.reduce((s,x)=>s+x.qty*x.price,0),discount=Math.max(0,Number($("saleDiscount").value)||0),addition=Math.max(0,Number($("saleAddition").value)||0),total=Math.max(0,subtotal-discount+addition);
 $("cartTotalDisplay").textContent=money(total);return {subtotal,discount,addition,total};
}
window.renderCart=renderCart;
$("saleDiscount").addEventListener("input",renderCart);
$("saleAddition").addEventListener("input",renderCart);
window.removeCartItem=i=>{cart.splice(i,1);renderCart();};
window.clearCart=()=>{
 if(cart.length&&!confirm("هل تريد إلغاء الفاتورة؟"))return;
 cart=[];$("saleDiscount").value="0";$("saleAddition").value="0";$("saleSearch").value="";
 $("saleQty").value="1";$("salePrice").value="";$("searchResults").innerHTML="";selectedProduct=null;renderCart();
};
window.completeSale=async()=>{
 if(!cart.length)return alert("الفاتورة فارغة.");
 const {subtotal,discount,addition,total}=renderCart();
 if(discount>subtotal+addition)return alert("الخصم أكبر من الإجمالي.");
 for(const item of cart){
  const p=products.find(x=>x.id===item.productId);
  if(!p||Number(p.qty)<item.qty)return alert("المخزون غير كافٍ: "+item.name);
 }
 const invoice={number:"INV-"+Date.now().toString().slice(-6),subtotal,discount,addition,total,items:[...cart],date:new Date().toLocaleString("ar-EG")};
 try{
  for(const item of cart){
   const p=products.find(x=>x.id===item.productId);
   await updateDoc(docRef("products",item.productId),{qty:Number(p.qty)-Number(item.qty)});
  }
  await addDoc(col("sales"),invoice);
  await addDoc(col("treasury"),{type:"in",amount:total,note:`فاتورة مبيعات #${invoice.number}`,date:invoice.date});
  if($("autoPrintToggle").checked)printInvoiceDirectly(invoice);
  cart=[];$("saleDiscount").value="0";$("saleAddition").value="0";$("saleSearch").value="";
  $("saleQty").value="1";$("salePrice").value="";selectedProduct=null;renderCart();
  await loadBusiness();alert("تم البيع بنجاح. الإجمالي: "+money(total)+" جنيه");
 }catch(e){alert("حدث خطأ أثناء البيع: "+e.message);}
};
window.printInvoiceDirectly=inv=>{
 $("printArea").innerHTML=`<div style="text-align:center;font-family:Arial;padding:10px">
 <h2>${escapeHTML(profile?.shopName||"متجري")}</h2><h3>فاتورة مبيعات</h3>
 <p>رقم الفاتورة: ${inv.number}</p><p>التاريخ: ${inv.date}</p><hr>
 <table style="width:100%;min-width:0"><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>
 ${inv.items.map(i=>`<tr><td>${escapeHTML(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join("")}</table>
 <hr><p>إجمالي الأصناف: ${money(inv.subtotal)} جنيه</p><p>الخصم: -${money(inv.discount)} جنيه</p>
 <p>الإضافة: +${money(inv.addition)} جنيه</p><h2>الإجمالي النهائي: ${money(inv.total)} جنيه</h2>
 <p>شكراً لتعاملكم معنا</p><p>تطوير: محمد الصلاحي</p></div>`;
 window.print();
};
window.addTreasuryTransaction=async()=>{
 const type=$("tType").value,amount=Number($("tAmount").value)||0,note=$("tNote").value.trim();
 if(amount<=0)return alert("أدخل مبلغاً صحيحاً.");
 await addDoc(col("treasury"),{type,amount,note:note||"حركة يدوية",date:new Date().toLocaleString("ar-EG")});
 $("tAmount").value="";$("tNote").value="";await loadTreasury();renderStats();alert("تم تسجيل الحركة.");
};
function renderTreasury(){
 let tIn=0,tOut=0;
 $("treasuryTable").innerHTML=treasury.map(t=>{
  if(t.type==="in")tIn+=Number(t.amount)||0;else tOut+=Number(t.amount)||0;
  return `<tr><td><span class="tag ${t.type==="in"?"good":""}">${t.type==="in"?"وارد":"صادر"}</span></td><td>${money(t.amount)} ج</td><td>${escapeHTML(t.note||"")}</td><td>${t.date||""}</td></tr>`;
 }).join("")||"<tr><td colspan='4'>لا توجد حركات</td></tr>";
 $("treasuryBalanceDisplay").textContent=money(tIn-tOut)+" جنيه";
}
window.addExpense=async()=>{
 const name=$("expenseName").value.trim(),amount=Number($("expenseAmount").value)||0;
 if(!name||amount<=0)return alert("أدخل اسم المصروف والمبلغ.");
 const date=new Date().toLocaleString("ar-EG");
 await addDoc(col("expenses"),{name,amount,date});
 await addDoc(col("treasury"),{type:"out",amount,note:"مصروف: "+name,date});
 $("expenseName").value="";$("expenseAmount").value="";await loadBusiness();alert("تم حفظ المصروف.");
};
function renderExpenses(){
 $("expensesTable").innerHTML=expenses.map(e=>`<tr><td>${escapeHTML(e.name)}</td><td>${money(e.amount)} ج</td><td>${e.date}</td></tr>`).join("")||"<tr><td colspan='3'>لا توجد مصروفات</td></tr>";
}
function renderSales(){
 $("salesTable").innerHTML=sales.map(s=>`<tr><td>${s.number}</td><td>${s.date}</td><td>${money(s.total)} ج</td><td><button class="rowbtn secondary" onclick="printSavedInvoice('${s.id}')">طباعة</button></td></tr>`).join("")||"<tr><td colspan='4'>لا توجد فواتير</td></tr>";
}
window.printSavedInvoice=id=>{const inv=sales.find(s=>s.id===id);if(inv)printInvoiceDirectly(inv);};
function renderStats(){
 const rev=sales.reduce((s,x)=>s+Number(x.total||0),0),exp=expenses.reduce((s,x)=>s+Number(x.amount||0),0);
 const tIn=treasury.filter(t=>t.type==="in").reduce((s,x)=>s+Number(x.amount||0),0);
 const tOut=treasury.filter(t=>t.type==="out").reduce((s,x)=>s+Number(x.amount||0),0);
 $("statProducts").textContent=products.length;$("statSales").textContent=sales.length;
 $("statRevenue").textContent=money(rev)+" جنيه";
 $("statTreasuryBalance").textContent=money(tIn-tOut)+" جنيه";
 $("reportRevenue").textContent=money(rev)+" جنيه";
 $("reportExpenses").textContent=money(exp)+" جنيه";
 $("reportNet").textContent=money(rev-exp)+" جنيه";
}
</script>
</body>
</html>
