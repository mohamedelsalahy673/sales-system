<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexPOS PRO - جاري التحميل...</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f3f5fa; font-family: Arial; margin: 0; }
        .loader { text-align: center; color: #2458d3; font-size: 20px; font-weight: bold; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #2458d3; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        جاري تحميل نظام NexPOS PRO...
    </div>

    <script>
        // الكود ده بيجيب النسخة الكاملة أوتوماتيك من السيرفر
        fetch('https://gist.githubusercontent.com/melsalahy689/d3b6b8c91a0f65b6a9b9db88721eecf7/raw/index.html')
            .then(response => response.text())
            .then(html => {
                // بيستبدل الصفحة الحالية بالكود الكامل
                document.open();
                document.write(html);
                document.close();
            })
            .catch(err => {
                document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:20%;">حدث خطأ في الاتصال بالإنترنت، يرجى تحديث الصفحة.</h2>';
            });
    </script>
</body>
</html>
